tspan x="118" y="369.5">your consent</tspan></text><rect class="ill-face" x="12" y="34" width="134" height="91.5" rx="6"/><g><path class="ill-face" d="M68,49.3 H83 L90,56.3 V75.3 H68 Z"/><path class="ill-line" d="M83,49.3 V56.3 H90 M73,61.3 H85 M73,66.3 H82 M73,71.3 H84"/></g><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="79" y="93.8">Supplier mail</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="79" y="108.3">as PDF</tspan></text><rect class="ill-face" x="156" y="34" width="134" height="91.5" rx="6"/><g><rect class="ill-face" x="215" y="42" width="16" height="26" rx="3"/><path class="ill-line" d="M218.5,48 H227.5 M218.5,52.5 H225.5 M220.8,64 H225.2"/></g><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="223" y="86.5">You</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="223" y="101">on your phone or</tspan><tspan x="223" y="115.5">in a browser</tspan></text><rect class="ill-face" x="12" y="168.5" width="278" height="46" rx="6"/><g><rect class="ill-face" x="20" y="178.5" width="26" height="26" rx="2.5"/><path class="ill-line" d="M24,185.5 H37"/><circle class="ill-dot" cx="41" cy="185.5" r="1.4"/><path class="ill-line" d="M24,191.5 H37"/><circle class="ill-dot" cx="41" cy="191.5" r="1.4"/><path class="ill-line" d="M24,197.5 H37"/><circle class="ill-dot" cx="41" cy="197.5" r="1.4"/></g><text class="ill-name" font-size="13.5" text-anchor="start"><tspan x="54" y="190">Energietracker</tspan></text><text class="ill-sub" font-size="12" text-anchor="start"><tspan x="54" y="204.5">with the inbox</tspan></text><rect class="ill-face" x="12" y="257.5" width="278" height="60.5" rx="6"/><g><rect class="ill-face" x="20" y="275.8" width="30" height="24" rx="2.5"/><path class="ill-line" d="M20,282.8 H50 M25,288.8 H45 M25,293.8 H40"/><circle class="ill-dot" cx="24" cy="279.3" r="1.2"/><circle class="ill-dot" cx="28.5" cy="279.3" r="1.2"/></g><text class="ill-name" font-size="13.5" text-anchor="start"><tspan x="58" y="279">AI at home</tspan></text><text class="ill-sub" font-size="12" text-anchor="start"><tspan x="58" y="293.5">if you like; without it you enter</tspan><tspan x="58" y="308">by hand</tspan></text><rect class="ill-face" x="4" y="380" width="146" height="89.5" rx="6"/><path class="ill-face" d="M67.6,412 C61.5,412 59,405.8 60.8,401.4 C62.2,397.1 66.2,395.7 69.1,397.1 C70.9,389.9 80.6,387.3 84.2,394.7 C89.6,392.8 95,398.1 93.6,402.9 C95.7,407.7 91.4,412 87.1,412 Z"/><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="77" y="430.5">Cloud service</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="77" y="445">experimental, only</tspan><tspan x="77" y="459.5">if switched on</tspan></text><rect class="ill-face" x="166" y="380" width="150" height="89.5" rx="6"/><path class="ill-face" d="M231.6,412 C225.5,412 223,405.8 224.8,401.4 C226.2,397.1 230.2,395.7 233.1,397.1 C234.9,389.9 244.6,387.3 248.2,394.7 C253.6,392.8 259,398.1 257.6,402.9 C259.7,407.7 255.4,412 251.1,412 Z"/><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="241" y="430.5">Weather service</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="241" y="445">rounded location,</tspan><tspan x="241" y="459.5">can be switched off</tspan></text></svg>
