<svg width="760" height="520" class="ill ill--scene ill--scene-wide" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: All together"><title>Diagram: All together</title><style>:root{--bg-1:#ffffff;--bg-2:#eef2f7;--border-2:rgba(15, 23, 42, 0.14);--text-1:#0f172a;--text-2:#475569;--accent:#2563eb;--info:#2563eb;--warning:#a84d07;--danger:#b91c1c;--success:#036c4e;--font-sans:"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;--ill-line:var(--text-2);--ill-ink:var(--text-1);--ill-accent:var(--accent);--ill-fill:color-mix(in srgb, var(--accent) 14%, transparent);--ill-surface:var(--bg-2);--ill-ground:var(--border-2);--ill-stroke:1.5px;--ill-stroke-strong:2px}@media (prefers-color-scheme:dark){:root{--bg-1:#111827;--bg-2:#1c2636;--border-2:rgba(255, 255, 255, 0.12);--text-1:#dce8f5;--text-2:#8ba0ba;--accent:#4a90e2;--info:#4a90e2;--warning:#fbbf24;--danger:#f87171;--success:#34d399}}.ill * { vector-effect: non-scaling-stroke; }.ill .ill-line { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-ink { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-accent { fill: none; stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-fill { fill: var(--ill-fill); stroke: none; }.ill .ill-face { fill: var(--ill-surface); stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linejoin: round; }.ill .ill-ground { fill: none; stroke: var(--ill-ground); stroke-width: var(--ill-stroke); stroke-linecap: round; }.ill .ill-dot { fill: var(--ill-accent); stroke: none; }.ill .ill-text { fill: var(--ill-ink); font-size: var(--fs-xs); stroke: none; }.ill .ill-util { fill: none; stroke: var(--c, var(--ill-accent)); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-util-fill { fill: color-mix(in srgb, var(--c, var(--ill-accent)) 16%, transparent); stroke: none; }.ill-c-strom { --c: var(--util-strom, var(--info)); }.ill-c-gas { --c: var(--util-gas, var(--warning)); }.ill-c-wasser { --c: var(--util-wasser, var(--info)); }.ill-c-waerme { --c: var(--util-waerme, var(--danger)); }.ill-c-pv { --c: var(--util-pv_erzeugung, var(--warning)); }.ill-c-feed { --c: var(--util-pv_einspeisung, var(--success)); }.ill .ill-node { fill: var(--ill-ink); stroke: none; }.ill .ill-small { fill: var(--ill-line); font-size: var(--fs-xs); stroke: none; }.ill .ill-zone { fill: color-mix(in srgb, var(--accent) 4%, transparent); stroke: none; }.ill .ill-boundary { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-dasharray: 7 5; stroke-linecap: round; }.ill .ill-frame { fill: none; stroke: var(--ill-line); stroke-width: 1px; }.ill .ill-flow { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-flow--ink { stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--out { stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--dash { stroke-dasharray: 5 4; }.ill .ill-name { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-sub { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-port { fill: var(--ill-ink); stroke: none; }.ill .ill-flow-label { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-zone-label { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-frame-label { fill: var(--ill-line); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-bg{fill:var(--bg-1);stroke:none}</style><rect class="ill-bg" width="100%" height="100%"/><g><rect class="ill-zone" x="8" y="24" width="614" height="444.8" rx="10"/><rect class=