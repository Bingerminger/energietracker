 370,214.8"/><path class="ill-flow ill-flow--ink" d="M375.7,211.6 L370,214.8 L375.7,217.9"/><text class="ill-flow-label" font-size="11" text-anchor="middle"><tspan x="418" y="181.8">confirm a</tspan><tspan x="418" y="195.3">change in the</tspan><tspan x="418" y="208.8">app</tspan></text><polyline class="ill-flow ill-flow--line" points="538,170.5 538,144.5"/><path class="ill-flow ill-flow--line" d="M541.1,150.2 L538,144.5 L534.9,150.2"/><text class="ill-flow-label" font-size="11" text-anchor="start"><tspan x="544" y="158.5">you ask</tspan></text><polyline class="ill-flow ill-flow--out ill-flow--dash" points="330,259 330,330.3 636,330.3"/><path class="ill-flow ill-flow--out" d="M630.3,333.4 L636,330.3 L630.3,327.1"/><text class="ill-flow-label" font-size="11" text-anchor="middle"><tspan x="480" y="324.3">only what you explicitly switch on</tspan></text><polyline class="ill-flow ill-flow--out ill-flow--dash" points="295,259 295,454.8 636,454.8"/><path class="ill-flow ill-flow--out" d="M630.3,457.9 L636,454.8 L630.3,451.6"/><rect class="ill-face" x="24" y="56" width="130" height="88.5" rx="6"/><g><path class="ill-fill" d="M78,81.7 L89,72.8 L100,81.7 V96.8 H78 Z"/><path class="ill-line" d="M75,83.7 L89,70.8 L103,83.7 M79,81.7 V96.8 H99 V81.7"/><path class="ill-line" d="M85.9,96.8 V87.5 H92.1 V96.8"/></g><text class="ill-name" font-size="12.5" text-anchor="middle"><tspan x="89" y="114.3">Home Assistant</tspan></text><text class="ill-sub" font-size="11" text-anchor="middle"><tspan x="89" y="127.8">with smart meters</tspan></text><rect class="ill-face" x="24" y="170.5" width="130" height="88.5" rx="6"/><g><path class="ill-face" d="M78,185.3 H93 L100,192.3 V211.3 H78 Z"/><path class="ill-line" d="M93,185.3 V192.3 H100 M83,197.3 H95 M83,202.3 H92 M83,207.3 H94"/></g><text class="ill-name" font-size="12.5" text-anchor="middle"><tspan x="89" y="228.8">Supplier mail</tspan></text><text class="ill-sub" font-size="11" text-anchor="middle"><tspan x="89" y="242.3">as PDF</tspan></te