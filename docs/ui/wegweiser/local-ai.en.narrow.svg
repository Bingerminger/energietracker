-anchor="middle"><tspan x="241" y="533.5">Weather service</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="241" y="548">rounded location,</tspan><tspan x="241" y="562.5">can be switched off</tspan></text></svg>
