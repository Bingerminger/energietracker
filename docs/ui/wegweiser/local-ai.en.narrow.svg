label" font-size="12" text-anchor="start"><tspan x="198" y="215.5">↓ figures with</tspan><tspan x="198" y="230">their source</tspan></text><polyline class="ill-flow ill-flow--line" points="44,327.5 44,378.5"/><path class="ill-flow ill-flow--line" d="M40.9,372.8 L44,378.5 L47.1,372.8"/><polyline class="ill-flow ill-flow--line" points="58,378.5 58,327.5"/><path class="ill-flow ill-flow--line" d="M61.1,333.2 L58,327.5 L54.9,333.2"/><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="68" y="353.5">↓ question and figures</tspan></text><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="68" y="368">↑ text of the answer</tspan></text><polyline class="ill-flow ill-flow--out ill-flow--dash" points="96,483 96,439"/><path class="ill-flow ill-flow--out" d="M99.1,444.7 L96,439 L92.9,444.7"/><polyline class="ill-flow ill-flow--out ill-flow--dash" points="290,116.5 305,116.5 305,483"/><path class="ill-flow ill-flow--out" d="M301.9,477.3 L305,483 L308.1,477.3"/><rect class="ill-face" x="12" y="64.5" width="138" height="104" rx="6"/><g><rect class="ill-face" x="73" y="78.8" width="16" height="26" rx="3"/><path class="ill-line" d="M76.5,84.8 H85.5 M76.5,89.3 H83.5 M78.8,100.8 H83.2"/></g><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="81" y="123.3">You</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="81" y="137.8">on your phone or</tspan><tspan x="81" y="152.3">in a browser</tspan></text><rect class="ill-face" x="162" y="64.5" width="128" height="104" rx="6"/><g><rect class="ill-face" x="209" y="72.5" width="34" height="24" rx="1.5"/><path class="ill-line" d="M214.7,76.5 V92.5 M220.3,76.5 V92.5 M226,76.5 V92.5 M231.7,76.5 V92.5 M237.3,76.5 V92.5"/></g><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="226" y="115">Energietracker</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="226" y="129.5">in a container,</tspan><tspan x="226" y="1