<svg width="320" height="346" class="ill ill--scene ill--scene-narrow" viewBox="0 0 320 346" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: By hand"><title>Diagram: By hand</title><style>:root{--bg-1:#ffffff;--bg-2:#eef2f7;--border-2:rgba(15, 23, 42, 0.14);--text-1:#0f172a;--text-2:#475569;--accent:#2563eb;--info:#2563eb;--warning:#a84d07;--danger:#b91c1c;--success:#036c4e;--font-sans:"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;--ill-line:var(--text-2);--ill-ink:var(--text-1);--ill-accent:var(--accent);--ill-fill:color-mix(in srgb, var(--accent) 14%, transparent);--ill-surface:var(--bg-2);--ill-ground:var(--border-2);--ill-stroke:1.5px;--ill-stroke-strong:2px}@media (prefers-color-scheme:dark){:root{--bg-1:#111827;--bg-2:#1c2636;--border-2:rgba(255, 255, 255, 0.12);--text-1:#dce8f5;--text-2:#8ba0ba;--accent:#4a90e2;--info:#4a90e2;--warning:#fbbf24;--danger:#f87171;--success:#34d399}}.ill * { vector-effect: non-scaling-stroke; }.ill .ill-line { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-ink { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-accent { fill: none; stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-fill { fill: var(--ill-fill); stroke: none; }.ill .ill-face { fill: var(--ill-surface); stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linejoin: round; }.ill .ill-ground { fill: none; stroke: var(--ill-ground); stroke-width: var(--ill-stroke); stroke-linecap: round; }.ill .ill-dot { fill: var(--ill-accent); stroke: none; }.ill .ill-text { fill: var(--ill-ink); font-size: var(--fs-xs); stroke: none; }.ill .ill-util { fill: none; stroke: var(--c, var(--ill-accent)); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-util-fill { fill: color-mix(in srgb, var(--c, var(--ill-accent)) 16%, transparent); stroke: none; }.ill-c-strom { --c: var(--util-strom, var(--info)); }.ill-c-gas { --c: var(--util-gas, var(--warning)); }.ill-c-wasser { --c: var(--util-wasser, var(--info)); }.ill-c-waerme { --c: var(--util-waerme, var(--danger)); }.ill-c-pv { --c: var(--util-pv_erzeugung, var(--warning)); }.ill-c-feed { --c: var(--util-pv_einspeisung, var(--success)); }.ill .ill-node { fill: var(--ill-ink); stroke: none; }.ill .ill-small { fill: var(--ill-line); font-size: var(--fs-xs); stroke: none; }.ill .ill-zone { fill: color-mix(in srgb, var(--accent) 4%, transparent); stroke: none; }.ill .ill-boundary { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-dasharray: 7 5; stroke-linecap: round; }.ill .ill-frame { fill: none; stroke: var(--ill-line); stroke-width: 1px; }.ill .ill-flow { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-flow--ink { stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--out { stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--dash { stroke-dasharray: 5 4; }.ill .ill-name { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-sub { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-port { fill: var(--ill-ink); stroke: none; }.ill .ill-flow-label { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-zone-label { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-frame-label { fill: var(--ill-line); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-bg{fill:var(--bg-1);stroke:none}</style><rect class="ill-bg" width="100%" height="100%"/><g><rect class="ill-zone" x="4" y="4" width="312" height="249.5" rx="10"/><rect class="ill-boundary" x="4" y="4" width="312" height="249.5" rx="10"/><g><path class="ill-line" d="M13,18.9 L20.5,11 L28,18.9 M17,16.9 V25 H24 V16.9"/><path class="ill-line" d="M18.9,25 V20.1 H22.2 V25"/></g><text class="ill-zone-label" x="34" y="24" font-size="13">Your home</text></g><text class="ill-zone-label" font-size="13" text-anchor="end"><tspan x="310" y="270.5">Outside</tspan></text><polyline class="ill-flow ill-flow--line" points="40,76 40,106.5"/><path class="ill-flow ill-flow--line" d="M36.9,100.8 L40,106.5 L43.1,100.8"/><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="56" y="96">you read them</tspan></text><polyline class="ill-flow ill-flow--line" points="34,152.5 34,195.5"/><path class="ill-flow ill-flow--line" d="M30.9,189.8 L34,195.5 L37.1,189.8"/><polyline class="ill-flow ill-flow--line" points="48,195.5 48,152.5"/><path class="ill-flow ill-flow--line" d="M51.1,158.2 L48,152.5 L44.9,158.2"/><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="58" y="171.5">↓ enter the reading</tspan></text><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="58" y="186">↑ consumption, costs, deadlines</tspan></text><polyline class="ill-flow ill-flow--out ill-flow--dash" points="40,241.5 40,279.5"/><path class="ill-flow ill-flow--out" d="M36.9,273.8 L40,279.5 L43.1,273.8"/><rect class="ill-face" x="12" y="34" width="284" height="42" rx="6"/><g class="ill-c-strom"><rect class="ill-face" x="20" y="42" width="16" height="26" rx="3"/><rect class="ill-util" x="20" y="42" width="16" height="26" rx="3"/><rect class="ill-line" x="24" y="47" width="8" height="7.8" rx="1.5"/><circle class="ill-dot" cx="28" cy="60.7" r="2"/></g><g class="ill-c-gas"><rect class="ill-face" x="40" y="42" width="16" height="26" rx="3"/><rect class="ill-util" x="40" y="42" width="16" height="26" rx="3"/><rect class="ill-line" x="44" y="47" width="8" height="7.8" rx="1.5"/><circle class="ill-dot" cx="48" cy="60.7" r="2"/></g><text class="ill-name" font-size="13.5" text-anchor="start"><tspan x="64" y="60.8">Your meters</tspan></text><rect class="ill-face" x="12" y="106.5" width="284" height="46" rx="6"/><g><rect class="ill-face" x="20" y="116.5" width="16" height="26" rx="3"/><path class="ill-line" d="M23.5,122.5 H32.5 M23.5,127 H30.5 M25.8,138.5 H30.2"/></g><text class="ill-name" font-size="13.5" text-anchor="start"><tspan x="44" y="128">You</tspan></text><text class="ill-sub" font-size="12" text-anchor="start"><tspan x="44" y="142.5">on your phone or in a browser</tspan></text><rect class="ill-face" x="12" y="195.5" width="284" height="46" rx="6"/><g><rect class="ill-face" x="20" y="205.5" width="26" height="26" rx="2.5"/><path class="ill-line" d="M24,212.5 H37"/><circle class="ill-dot" cx="41" cy="212.5" r="1.4"/><path class="ill-line" d="M24,218.5 H37"/><circle class="ill-dot" cx="41" cy="218.5" r="1.4"/><path class="ill-line" d="M24,224.5 H37"/><circle class="ill-dot" cx="41" cy="224.5" r="1.4"/></g><text class="ill-name" font-size="13.5" text-anchor="start"><tspan x="54" y="217">Energietracker</tspan></text><text class="ill-sub" font-size="12" text-anchor="start"><tspan x="54" y="231.5">on Docker, a NAS or a web server</tspan></text><rect class="ill-face" x="12" y="279.5" width="284" height="60.5" rx="6"/><path class="ill-face" d="M28.6,321.8 C22.5,321.8 20,315.5 21.8,311.2 C23.2,306.9 27.2,305.4 30.1,306.9 C31.9,299.7 41.6,297 45.2,304.5 C50.6,302.6 56,307.8 54.6,312.6 C56.7,317.4 52.4,321.8 48.1,321.8 Z"/><text class="ill-name" font-size="13.5" text-anchor="start"><tspan x="64" y="301">Weather service</tspan></text><text class="ill-sub" font-size="12" text-anchor="start"><tspan x="64" y="315.5">rounded location, can be switched</tspan><tspan x="64" y="330">off</tspan></text></svg>
