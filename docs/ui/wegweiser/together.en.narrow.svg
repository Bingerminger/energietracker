<svg width="320" height="609" class="ill ill--scene ill--scene-narrow" viewBox="0 0 320 609" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: All together"><title>Diagram: All together</title><style>:root{--bg-1:#ffffff;--bg-2:#eef2f7;--border-2:rgba(15, 23, 42, 0.14);--text-1:#0f172a;--text-2:#475569;--accent:#2563eb;--info:#2563eb;--warning:#a84d07;--danger:#b91c1c;--success:#036c4e;--font-sans:"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;--ill-line:var(--text-2);--ill-ink:var(--text-1);--ill-accent:var(--accent);--ill-fill:color-mix(in srgb, var(--accent) 14%, transparent);--ill-surface:var(--bg-2);--ill-ground:var(--border-2);--ill-stroke:1.5px;--ill-stroke-strong:2px}@media (prefers-color-scheme:dark){:root{--bg-1:#111827;--bg-2:#1c2636;--border-2:rgba(255, 255, 255, 0.12);--text-1:#dce8f5;--text-2:#8ba0ba;--accent:#4a90e2;--info:#4a90e2;--warning:#fbbf24;--danger:#f87171;--success:#34d399}}.ill * { vector-effect: non-scaling-stroke; }.ill .ill-line { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-ink { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-accent { fill: none; stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-fill { fill: var(--ill-fill); stroke: none; }.ill .ill-face { fill: var(--ill-surface); stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linejoin: round; }.ill .ill-ground { fill: none; stroke: var(--ill-ground); stroke-width: var(--ill-stroke); stroke-linecap: round; }.ill .ill-dot { fill: var(--ill-accent); stroke: none; }.ill .ill-text { fill: var(--ill-ink); font-size: var(--fs-xs); stroke: none; }.ill .ill-util { fill: none; stroke: var(--c, var(--ill-accent)); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-util-fill { fill: color-mix(in srgb, var(--c, var(--ill-accent)) 16%, transparent); stroke: none; }.ill-c-strom { --c: var(--util-strom, var(--info)); }.ill-c-gas { --c: var(--util-gas, var(--warning)); }.ill-c-wasser { --c: var(--util-wasser, var(--info)); }.ill-c-waerme { --c: var(--util-waerme, var(--danger)); }.ill-c-pv { --c: var(--util-pv_erzeugung, var(--warning)); }.ill-c-feed { --c: var(--util-pv_einspeisung, var(--success)); }.ill .ill-node { fill: var(--ill-ink); stroke: none; }.ill .ill-small { fill: var(--ill-line); font-size: var(--fs-xs); stroke: none; }.ill .ill-zone { fill: color-mix(in srgb, var(--accent) 4%, transparent); stroke: none; }.ill .ill-boundary { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-dasharray: 7 5; stroke-linecap: round; }.ill .ill-frame { fill: none; stroke: var(--ill-line); stroke-width: 1px; }.ill .ill-flow { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-flow--ink { stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--out { stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--dash { stroke-dasharray: 5 4; }.ill .ill-name { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-sub { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-port { fill: var(--ill-ink); stroke: none; }.ill .ill-flow-label { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-zone-label { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-frame-label { fill: var(--ill-line); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-bg{fill:var(--bg-1);stroke:none}</style><rect class="ill-bg" width="100%" height="100%"/><g><rect class="ill-zone" x="4" y="4" width="312" height="459.5" rx="10"/><rect class="ill-boundary" x="4" y="4" width="312" height="459.5" rx="10"/><g><path class="ill-line" d="M13,18.9 L20.5,11 L28,18.9 M17,16.9 V25 H24 V16.9"/><path class="ill-line" d="M18.9,25 V20.1 H22.2 V25"/></g><text class="ill-zone-label" x="34" y="24" font-size="13">Your home</text></g><text class="ill-zone-label" font-size="13" text-anchor="start"><tspan x="12" y="480.5">Outside</tspan></text><polyline class="ill-flow ill-flow--line" points="34,141 34,227.5"/><path class="ill-flow ill-flow--line" d="M30.9,221.8 L34,227.5 L37.1,221.8"/><polyline class="ill-flow ill-flow--line" points="48,227.5 48,141"/><path class="ill-flow ill-flow--line" d="M51.1,146.7 L48,141 L44.9,146.7"/><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="56" y="159">↓ readings,</tspan><tspan x="56" y="173.5">daily or per</tspan><tspan x="56" y="188">quarter-hour</tspan></text><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="56" y="202.5">↑ sensors,</tspan><tspan x="56" y="217">notices, dates</tspan></text><polyline class="ill-flow ill-flow--line" points="190,141 190,227.5"/><path class="ill-flow ill-flow--line" d="M186.9,221.8 L190,227.5 L193.1,221.8"/><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="198" y="159">drop the PDF</tspan></text><polyline class="ill-flow ill-flow--line" points="34,345.5 34,273.5"/><path class="ill-flow ill-flow--line" d="M37.1,279.2 L34,273.5 L30.9,279.2"/><polyline class="ill-flow ill-flow--line" points="48,273.5 48,345.5"/><path class="ill-flow ill-flow--line" d="M44.9,339.8 L48,345.5 L51.1,339.8"/><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="56" y="291.5">↑ looks it up:</tspan><tspan x="56" y="306">MCP with a key</tspan></text><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="56" y="320.5">↓ figures with</tspan><tspan x="56" y="335">their source</tspan></text><polyline class="ill-flow ill-flow--ink" points="190,345.5 190,273.5"/><path class="ill-flow ill-flow--ink" d="M193.1,279.2 L190,273.5 L186.9,279.2"/><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="198" y="291.5">confirm a</tspan><tspan x="198" y="306">change in the</tspan><tspan x="198" y="320.5">app</tspan></text><polyline class="ill-flow ill-flow--line" points="170,391.3 132,391.3"/><path class="ill-flow ill-flow--line" d="M137.7,388.1 L132,391.3 L137.7,394.4"/><text class="ill-flow-label" font-size="12" text-anchor="middle"><tspan x="151" y="453">you ask</tspan></text><polyline class="ill-flow ill-flow--out ill-flow--dash" points="290,245.5 305,245.5 305,513.5"/><path class="ill-flow ill-flow--out" d="M301.9,507.8 L305,513.5 L308.1,507.8"/><polyline class="ill-flow ill-flow--out ill-flow--dash" points="290,255.5 297,255.5 297,472.5 110,472.5 110,513.5"/><path class="ill-flow ill-flow--out" d="M106.9,507.8 L110,513.5 L113.1,507.8"/><text class="ill-flow-label" font-size="12" text-anchor="start"><tspan x="118" y="488.5">only what you explicitly</tspan><tspan x="118" y="503">switch on</tspan></text><rect class="ill-face" x="12" y="34" width="120" height="107" rx="6"/><g><path class="ill-fill" d="M61,52.9 L72,44 L83,52.9 V68 H61 Z"/><path class="ill-line" d="M58,54.9 L72,42 L86,54.9 M62,52.9 V68 H82 V52.9"/><path class="ill-line" d="M68.9,68 V58.8 H75.1 V68"/></g><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="72" y="86.5">Home</tspan><tspan x="72" y="102">Assistant</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="72" y="116.5">with smart</tspan><tspan x="72" y="131">meters</tspan></text><rect class="ill-face" x="170" y="34" width="120" height="107" rx="6"/><g><path class="ill-face" d="M219,57 H234 L241,64 V83 H219 Z"/><path class="ill-line" d="M234,57 V64 H241 M224,69 H236 M224,74 H233 M224,79 H235"/></g><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="230" y="101.5">Supplier mail</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="230" y="116">as PDF</tspan></text><rect class="ill-face" x="12" y="227.5" width="278" height="46" rx="6"/><g><rect class="ill-face" x="20" y="237.5" width="26" height="26" rx="2.5"/><path class="ill-line" d="M24,244.5 H37"/><circle class="ill-dot" cx="41" cy="244.5" r="1.4"/><path class="ill-line" d="M24,250.5 H37"/><circle class="ill-dot" cx="41" cy="250.5" r="1.4"/><path class="ill-line" d="M24,256.5 H37"/><circle class="ill-dot" cx="41" cy="256.5" r="1.4"/></g><text class="ill-name" font-size="13.5" text-anchor="start"><tspan x="54" y="249">Energietracker</tspan></text><text class="ill-sub" font-size="12" text-anchor="start"><tspan x="54" y="263.5">calculates and shows</tspan></text><rect class="ill-face" x="12" y="345.5" width="120" height="91.5" rx="6"/><g><rect class="ill-face" x="55" y="354.5" width="34" height="24" rx="1.5"/><path class="ill-line" d="M60.7,358.5 V374.5 M66.3,358.5 V374.5 M72,358.5 V374.5 M77.7,358.5 V374.5 M83.3,358.5 V374.5"/></g><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="72" y="397">AI at home</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="72" y="411.5">Open WebUI and</tspan><tspan x="72" y="426">Ollama</tspan></text><rect class="ill-face" x="170" y="345.5" width="120" height="91.5" rx="6"/><g><rect class="ill-face" x="222" y="353.5" width="16" height="26" rx="3"/><path class="ill-line" d="M225.5,359.5 H234.5 M225.5,364 H232.5 M227.8,375.5 H232.2"/></g><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="230" y="398">You</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="230" y="412.5">on your phone or</tspan><tspan x="230" y="427">in a browser</tspan></text><rect class="ill-face" x="4" y="513.5" width="146" height="89.5" rx="6"/><path class="ill-face" d="M67.6,545.5 C61.5,545.5 59,539.3 60.8,534.9 C62.2,530.6 66.2,529.2 69.1,530.6 C70.9,523.4 80.6,520.8 84.2,528.2 C89.6,526.3 95,531.6 93.6,536.4 C95.7,541.2 91.4,545.5 87.1,545.5 Z"/><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="77" y="564">Cloud service</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="77" y="578.5">experimental, only</tspan><tspan x="77" y="593">if switched on</tspan></text><rect class="ill-face" x="166" y="513.5" width="150" height="89.5" rx="6"/><path class="ill-face" d="M231.6,545.5 C225.5,545.5 223,539.3 224.8,534.9 C226.2,530.6 230.2,529.2 233.1,530.6 C234.9,523.4 244.6,520.8 248.2,528.2 C253.6,526.3 259,531.6 257.6,536.4 C259.7,541.2 255.4,545.5 251.1,545.5 Z"/><text class="ill-name" font-size="13.5" text-anchor="middle"><tspan x="241" y="564">Weather service</tspan></text><text class="ill-sub" font-size="12" text-anchor="middle"><tspan x="241" y="578.5">rounded location,</tspan><tspan x="241" y="593">can be switched off</tspan></text></svg>
