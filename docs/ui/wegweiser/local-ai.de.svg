in: round; }.ill .ill-util-fill { fill: color-mix(in srgb, var(--c, var(--ill-accent)) 16%, transparent); stroke: none; }.ill-c-strom { --c: var(--util-strom, var(--info)); }.ill-c-gas { --c: var(--util-gas, var(--warning)); }.ill-c-wasser { --c: var(--util-wasser, var(--info)); }.ill-c-waerme { --c: var(--util-waerme, var(--danger)); }.ill-c-pv { --c: var(--util-pv_erzeugung, var(--warning)); }.ill-c-feed { --c: var(--util-pv_einspeisung, var(--success)); }.ill .ill-node { fill: var(--ill-ink); stroke: none; }.ill .ill-small { fill: var(--ill-line); font-size: var(--fs-xs); stroke: none; }.ill .ill-zone { fill: color-mix(in srgb, var(--accent) 4%, transparent); stroke: none; }.ill .ill-boundary { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-dasharray: 7 5; stroke-linecap: round; }.ill .ill-frame { fill: none; stroke: var(--ill-line); stroke-width: 1px; }.ill .ill-flow { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-flow--ink { stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--out { stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--dash { stroke-dasharray: 5 4; }.ill .ill-name { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-sub { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-port { fill: var(--ill-ink); stroke: none; }.ill .ill-flow-label { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-zone-label { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-frame-label { fill: var(--ill-line); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-bg{fill:var(--bg-1);stroke:none}</style><rect class="ill-bg" width="100%" height="100%"/><g><rect class="ill-zone" x="8" y="24" width="614" height="327.5" rx="10"/><rect cl