<svg width="760" height="193" class="ill ill--scene ill--scene-wide" viewBox="0 0 760 193" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: By hand"><title>Diagram: By hand</title><style>:root{--bg-1:#ffffff;--bg-2:#eef2f7;--border-2:rgba(15, 23, 42, 0.14);--text-1:#0f172a;--text-2:#475569;--accent:#2563eb;--info:#2563eb;--warning:#a84d07;--danger:#b91c1c;--success:#036c4e;--font-sans:"DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;--ill-line:var(--text-2);--ill-ink:var(--text-1);--ill-accent:var(--accent);--ill-fill:color-mix(in srgb, var(--accent) 14%, transparent);--ill-surface:var(--bg-2);--ill-ground:var(--border-2);--ill-stroke:1.5px;--ill-stroke-strong:2px}@media (prefers-color-scheme:dark){:root{--bg-1:#111827;--bg-2:#1c2636;--border-2:rgba(255, 255, 255, 0.12);--text-1:#dce8f5;--text-2:#8ba0ba;--accent:#4a90e2;--info:#4a90e2;--warning:#fbbf24;--danger:#f87171;--success:#34d399}}.ill * { vector-effect: non-scaling-stroke; }.ill .ill-line { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-ink { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-accent { fill: none; stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-fill { fill: var(--ill-fill); stroke: none; }.ill .ill-face { fill: var(--ill-surface); stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linejoin: round; }.ill .ill-ground { fill: none; stroke: var(--ill-ground); stroke-width: var(--ill-stroke); stroke-linecap: round; }.ill .ill-dot { fill: var(--ill-accent); stroke: none; }.ill .ill-text { fill: var(--ill-ink); font-size: var(--fs-xs); stroke: none; }.ill .ill-util { fill: none; stroke: var(--c, var(--ill-accent)); stroke-width: var(--ill-stroke-strong); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-util-fill { fill: color-mix(in srgb, var(--c, var(--ill-accent)) 16%, transparent); stroke: none; }.ill-c-strom { --c: var(--util-strom, var(--info)); }.ill-c-gas { --c: var(--util-gas, var(--warning)); }.ill-c-wasser { --c: var(--util-wasser, var(--info)); }.ill-c-waerme { --c: var(--util-waerme, var(--danger)); }.ill-c-pv { --c: var(--util-pv_erzeugung, var(--warning)); }.ill-c-feed { --c: var(--util-pv_einspeisung, var(--success)); }.ill .ill-node { fill: var(--ill-ink); stroke: none; }.ill .ill-small { fill: var(--ill-line); font-size: var(--fs-xs); stroke: none; }.ill .ill-zone { fill: color-mix(in srgb, var(--accent) 4%, transparent); stroke: none; }.ill .ill-boundary { fill: none; stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); stroke-dasharray: 7 5; stroke-linecap: round; }.ill .ill-frame { fill: none; stroke: var(--ill-line); stroke-width: 1px; }.ill .ill-flow { fill: none; stroke: var(--ill-line); stroke-width: var(--ill-stroke); stroke-linecap: round; stroke-linejoin: round; }.ill .ill-flow--ink { stroke: var(--ill-ink); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--out { stroke: var(--ill-accent); stroke-width: var(--ill-stroke-strong); }.ill .ill-flow--dash { stroke-dasharray: 5 4; }.ill .ill-name { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-sub { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-port { fill: var(--ill-ink); stroke: none; }.ill .ill-flow-label { fill: var(--ill-line); font-family: var(--font-sans); stroke: none; }.ill .ill-zone-label { fill: var(--ill-ink); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-frame-label { fill: var(--ill-line); font-family: var(--font-sans); font-weight: 600; stroke: none; }.ill .ill-bg{fill:var(--bg-1);stroke:none}</style><rect class="ill-bg" width="100%" height="100%"/><g><rect class="ill-zone" x="8" y="24" width="614" height="160.5" rx="10"/><rect class="ill-boundary" x="8" y="24" width="614" height="160.5" rx="10"/><g><path class="ill-line" d="M17,38.9 L24.5,31 L32,38.9 M21,36.9 V45 H28 V36.9"/><path class="ill-line" d="M22.9,45 V40.1 H26.2 V45"/></g><text class="ill-zone-label" x="38" y="43" font-size="12">Your home</text></g><text class="ill-zone-label" font-size="12" text-anchor="middle"><tspan x="694" y="44">Outside</tspan></text><polyline class="ill-flow ill-flow--line" points="136,113.3 226,113.3"/><path class="ill-flow ill-flow--line" d="M220.3,116.4 L226,113.3 L220.3,110.1"/><text class="ill-flow-label" font-size="11" text-anchor="middle"><tspan x="181" y="107.3">you read them</tspan></text><polyline class="ill-flow ill-flow--line" points="356,105.3 462,105.3"/><path class="ill-flow ill-flow--line" d="M456.3,108.4 L462,105.3 L456.3,102.1"/><text class="ill-flow-label" font-size="11" text-anchor="middle"><tspan x="409" y="85.8">enter the</tspan><tspan x="409" y="99.3">reading</tspan></text><polyline class="ill-flow ill-flow--line" points="462,121.3 356,121.3"/><path class="ill-flow ill-flow--line" d="M361.7,118.1 L356,121.3 L361.7,124.4"/><text class="ill-flow-label" font-size="11" text-anchor="middle"><tspan x="409" y="137.3">consumption,</tspan><tspan x="409" y="150.8">costs, deadlines</tspan></text><polyline class="ill-flow ill-flow--out ill-flow--dash" points="610,113.3 636,113.3"/><path class="ill-flow ill-flow--out" d="M630.3,116.4 L636,113.3 L630.3,110.1"/><rect class="ill-face" x="24" y="56" width="112" height="114.5" rx="6"/><g class="ill-c-strom"><rect class="ill-face" x="62" y="90.5" width="16" height="26" rx="3"/><rect class="ill-util" x="62" y="90.5" width="16" height="26" rx="3"/><rect class="ill-line" x="66" y="95.5" width="8" height="7.8" rx="1.5"/><circle class="ill-dot" cx="70" cy="109.2" r="2"/></g><g class="ill-c-gas"><rect class="ill-face" x="82" y="90.5" width="16" height="26" rx="3"/><rect class="ill-util" x="82" y="90.5" width="16" height="26" rx="3"/><rect class="ill-line" x="86" y="95.5" width="8" height="7.8" rx="1.5"/><circle class="ill-dot" cx="90" cy="109.2" r="2"/></g><text class="ill-name" font-size="12.5" text-anchor="middle"><tspan x="80" y="134">Your meters</tspan></text><rect class="ill-face" x="226" y="56" width="130" height="114.5" rx="6"/><g><rect class="ill-face" x="283" y="77" width="16" height="26" rx="3"/><path class="ill-line" d="M286.5,83 H295.5 M286.5,87.5 H293.5 M288.8,99 H293.2"/></g><text class="ill-name" font-size="12.5" text-anchor="middle"><tspan x="291" y="120.5">You</tspan></text><text class="ill-sub" font-size="11" text-anchor="middle"><tspan x="291" y="134">on your phone or in</tspan><tspan x="291" y="147.5">a browser</tspan></text><rect class="ill-face" x="462" y="56" width="148" height="114.5" rx="6"/><g><rect class="ill-face" x="523" y="77" width="26" height="26" rx="2.5"/><path class="ill-line" d="M527,84 H540"/><circle class="ill-dot" cx="544" cy="84" r="1.4"/><path class="ill-line" d="M527,90 H540"/><circle class="ill-dot" cx="544" cy="90" r="1.4"/><path class="ill-line" d="M527,96 H540"/><circle class="ill-dot" cx="544" cy="96" r="1.4"/></g><text class="ill-name" font-size="12.5" text-anchor="middle"><tspan x="536" y="120.5">Energietracker</tspan></text><text class="ill-sub" font-size="11" text-anchor="middle"><tspan x="536" y="134">on Docker, a NAS or a</tspan><tspan x="536" y="147.5">web server</tspan></text><rect class="ill-face" x="636" y="56" width="116" height="114.5" rx="6"/><path class="ill-face" d="M684.6,88 C678.5,88 676,81.8 677.8,77.4 C679.2,73.1 683.2,71.7 686.1,73.1 C687.9,65.9 697.6,63.3 701.2,70.7 C706.6,68.8 712,74.1 710.6,78.9 C712.7,83.7 708.4,88 704.1,88 Z"/><text class="ill-name" font-size="12.5" text-anchor="middle"><tspan x="694" y="105.5">Weather</tspan><tspan x="694" y="120">service</tspan></text><text class="ill-sub" font-size="11" text-anchor="middle"><tspan x="694" y="133.5">rounded</tspan><tspan x="694" y="147">location, can be</tspan><tspan x="694" y="160.5">switched off</tspan></text></svg>
