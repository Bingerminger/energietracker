<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Energietracker social preview</title>
<!--
  Social Preview für GitHub (seit v3.12.0), genau 1280 × 640 px; daraus entsteht social-preview.png,
  das unter Settings › Social preview von Hand hochgeladen wird.
  Eigene Grafiken: Logo (tools/build-logo.mjs), Symbole aus der App (icons/), Bild der neuen Übersicht
  aus dem Beispielhaushalt (screens/). Keine Pillen, keine Verläufe, eine Schrift (DM Sans).
  ?lang=de schaltet auf Deutsch (für Beiträge außerhalb von GitHub). Pfade relativ zu diesem Ordner.
-->
<style>
  @font-face { font-family: 'DM Sans'; font-weight: 100 1000; src: url(../../../public/vendor/fonts/dm-sans.woff2) format('woff2'); }
  :root { --ink: #0f172a; --ink-2: #334155; --muted: #475569; --paper: #f6f8fa; --card: #ffffff; --line: #dde4ed; --accent: #2563eb; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  .wrap { display: grid; grid-template-columns: 560px 1fr; height: 100%; }
  .left { padding: 56px 40px 48px 64px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 76px; height: 76px; }
  .brand h1 { font-size: 52px; font-weight: 700; letter-spacing: 0; }
  .claim { margin-top: 26px; font-size: 27px; line-height: 1.3; font-weight: 600; color: var(--ink); }
  .claim span { color: var(--muted); font-weight: 500; }
  ul { list-style: none; margin-top: 30px; display: grid; gap: 14px; }
  li { display: grid; grid-template-columns: 36px 1fr; gap: 14px; align-items: center; font-size: 21px; line-height: 1.25; color: var(--ink-2); }
  li img { width: 36px; height: 36px; }
  li b { color: var(--ink); font-weight: 600; }
  .foot { margin-top: auto; font-size: 18px; color: var(--muted); }
  .right { position: relative; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 56px; width: 980px; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgba(15, 23, 42, .12); }
  .phone { position: absolute; left: 470px; top: 250px; width: 200px; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 40px rgba(15, 23, 42, .18); }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="brand"><img src="logo.svg" alt=""><h1>Energietracker</h1></div>
    <p class="claim" data-t="claim"></p>
    <ul>
      <li><img src="icons/ki.svg" alt=""><span data-t="ai"></span></li>
      <li><img src="icons/waage.svg" alt=""><span data-t="rights"></span></li>
      <li><img src="icons/eingang.svg" alt=""><span data-t="inbox"></span></li>
      <li><img src="icons/geld.svg" alt=""><span data-t="balance"></span></li>
    </ul>
    <p class="foot" data-t="foot"></p>
  </div>
  <div class="right">
    <img class="shot" data-src="uebersicht" alt="">
    <img class="phone" data-src="iphone" alt="">
  </div>
</div>
<script>
  const TEXT = {
    en: {
      claim: 'Home Assistant measures, Energietracker settles the bill. <span>Self-hosted, for energy and water.</span>',
      ai: '<b>Ask your local AI</b> over MCP',
      rights: '<b>Your rights as a customer</b>, with a source',
      inbox: '<b>Supplier mail</b>, read for you',
      balance: '<b>Will I get money back?</b> Balance and forecast',
      foot: 'Open source (AGPL). No account, no database, no telemetry.',
    },
    de: {
      claim: 'Home Assistant misst, der Energietracker rechnet ab. <span>Selbst gehostet, für Energie und Wasser.</span>',
      ai: '<b>Frag deine KI im Heimnetz</b>, über MCP',
      rights: '<b>Deine Rechte als Kunde</b>, mit Quelle',
      inbox: '<b>Post vom Versorger</b>, für dich ausgelesen',
      balance: '<b>Bekomme ich Geld zurück?</b> Saldo und Prognose',
      foot: 'Open Source (AGPL). Kein Konto, keine Datenbank, keine Telemetrie.',
    },
  };
  const lang = new URLSearchParams(location.search).get('lang') === 'de' ? 'de' : 'en';
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = TEXT[lang][el.dataset.t];
  for (const el of document.querySelectorAll('[data-src]')) el.src = `screens/${el.dataset.src}.${lang}.png`;
</script>
</body>
</html>
