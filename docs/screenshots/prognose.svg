<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .bg{fill:#080c12}
      .topbar{fill:#111827}
      .card{fill:#111827;stroke:rgba(255,255,255,.07)}
      .border{stroke:rgba(255,255,255,.07);fill:none}
      .text{fill:#dce8f5}
      .muted{fill:#6b7f99}
      .dim{fill:#3d5070}
      .gas{fill:#ff7b2e}
      .strom{fill:#2de8a4}
      .blue{fill:#4a90e2}
      .red{fill:#ef4444}
      .num{font-family:'DM Mono',ui-monospace,monospace}
    </style>
  </defs>

  <rect class="bg" width="1100" height="720"/>
  <rect class="topbar" width="1100" height="48"/>
  <rect class="topbar" x="0" y="48" width="200" height="672"/>

  <text x="20" y="78" class="dim" font-size="9" letter-spacing="1.2">ANALYSE</text>
  <text x="50" y="107" class="muted" font-size="13">Korrelation</text>
  <rect x="12" y="118" width="176" height="34" rx="6" fill="#1c2636"/>
  <rect x="12" y="118" width="2" height="34" class="blue"/>
  <text x="50" y="138" class="text" font-size="13" font-weight="500">Prognose</text>

  <g transform="translate(220,72)">
    <text class="text" font-size="20" font-weight="700">🎯 Prognose</text>
    <text y="22" class="muted" font-size="12">12-Monats-Forecast · Saldo bei nächster Abrechnung</text>

    <!-- Model selector -->
    <g transform="translate(0,42)">
      <rect width="855" height="58" class="card" rx="10"/>
      <text x="14" y="22" class="muted" font-size="11" letter-spacing=".5">🎯 PROGNOSEMODELL</text>
      <g transform="translate(14,30)">
        <rect width="380" height="22" rx="4" fill="#1c2636"/>
        <rect x="3" y="3" width="90" height="16" rx="2" fill="#243044"/>
        <text x="48" y="15" class="muted" font-size="10" text-anchor="middle">Linear</text>
        <text x="138" y="15" class="muted" font-size="10" text-anchor="middle">Polynomial</text>
        <rect x="183" y="3" width="90" height="16" rx="2" fill="#2563eb"/>
        <text x="228" y="15" fill="#fff" font-size="10" text-anchor="middle">Robust</text>
        <text x="318" y="15" class="muted" font-size="10" text-anchor="middle">Segmentiert</text>
      </g>
      <text x="404" y="44" class="muted" font-size="11"><tspan font-weight="600" class="text">Robust</tspan> — Gas R²=0.9667 · Strom R²=0.7298</text>
    </g>

    <!-- Two balance KPI cards (Gas + Strom current contracts) -->
    <g transform="translate(0,118)">
      <rect width="420" height="146" class="card" rx="10"/>
      <line x1="0" y1="0" x2="0" y2="146" stroke="#ff7b2e" stroke-width="3"/>
      <text x="14" y="22" class="muted" font-size="11" letter-spacing=".5">⚖️ SALDO AKTUELLER VERTRAG — E.ON</text>
      <text x="14" y="38" class="num muted" font-size="10">9.2000 ct/kWh · 10.50 €/Monat · Abschlag 145.00 €</text>

      <g transform="translate(14,58)">
        <text class="muted" font-size="9" letter-spacing=".7">VERBRAUCHT</text>
        <text y="20" class="num text" font-size="14">1.666,64 €</text>
        <text y="34" class="muted" font-size="10">11 M · 18.920 kWh</text>

        <text x="120" class="muted" font-size="9" letter-spacing=".7">BEZAHLT</text>
        <text x="120" y="20" class="num text" font-size="14">1.780,00 €</text>
        <text x="120" y="34" class="muted" font-size="10">145 €/Monat</text>

        <text x="220" class="muted" font-size="9" letter-spacing=".7">SALDO</text>
        <text x="220" y="20" class="num strom" font-size="14">−113.36 €</text>
        <text x="220" y="34" class="muted" font-size="10">Überzahlt</text>

        <rect x="280" y="-10" width="124" height="74" rx="6" fill="rgba(45,232,164,.08)" stroke="rgba(45,232,164,.3)"/>
        <text x="290" y="2" class="muted" font-size="8" letter-spacing=".7">↓ ERWARTET</text>
        <text x="290" y="22" class="num strom" font-size="16" font-weight="600">−113.36 €</text>
        <text x="290" y="38" class="strom" font-size="10" font-weight="600">Erstattung</text>
        <text x="290" y="56" class="muted" font-size="9">2026-04-30</text>
      </g>

      <rect x="435" width="420" height="146" class="card" rx="10"/>
      <line x1="435" y1="0" x2="435" y2="146" stroke="#2de8a4" stroke-width="3"/>
      <text x="449" y="22" class="muted" font-size="11" letter-spacing=".5">⚖️ SALDO AKTUELLER VERTRAG — VATTENFALL</text>
      <text x="449" y="38" class="num muted" font-size="10">26.8000 ct/kWh · 9.90 €/Monat · Abschlag 80.00 €</text>

      <g transform="translate(449,58)">
        <text class="muted" font-size="9" letter-spacing=".7">VERBRAUCHT</text>
        <text y="20" class="num text" font-size="14">798,25 €</text>
        <text y="34" class="muted" font-size="10">11 M · 2.982 kWh</text>

        <text x="120" class="muted" font-size="9" letter-spacing=".7">BEZAHLT</text>
        <text x="120" y="20" class="num text" font-size="14">980,00 €</text>
        <text x="120" y="34" class="muted" font-size="10">80 €/Monat</text>

        <text x="220" class="muted" font-size="9" letter-spacing=".7">SALDO</text>
        <text x="220" y="20" class="num strom" font-size="14">−181.75 €</text>
        <text x="220" y="34" class="muted" font-size="10">Überzahlt</text>

        <rect x="280" y="-10" width="124" height="74" rx="6" fill="rgba(45,232,164,.08)" stroke="rgba(45,232,164,.3)"/>
        <text x="290" y="2" class="muted" font-size="8" letter-spacing=".7">↓ ERWARTET</text>
        <text x="290" y="22" class="num strom" font-size="16" font-weight="600">−181.75 €</text>
        <text x="290" y="38" class="strom" font-size="10" font-weight="600">Erstattung</text>
        <text x="290" y="56" class="muted" font-size="9">2026-04-30</text>
      </g>
    </g>

    <!-- KPI row: forecast totals -->
    <g transform="translate(0,282)">
      <rect width="207" height="80" class="card" rx="10"/>
      <line x1="0" y1="2" x2="120" y2="2" stroke="#ff7b2e" stroke-width="2"/>
      <text x="14" y="20" class="muted" font-size="10" letter-spacing=".5">🔥 GAS 12 M</text>
      <text x="14" y="48" class="num text" font-size="20">20.221 kWh</text>
      <text x="14" y="68" class="num muted" font-size="11">1.986 € · 9.20 ct/kWh</text>

      <rect x="221" width="207" height="80" class="card" rx="10"/>
      <line x1="221" y1="2" x2="341" y2="2" stroke="#2de8a4" stroke-width="2"/>
      <text x="235" y="20" class="muted" font-size="10" letter-spacing=".5">⚡ STROM 12 M</text>
      <text x="235" y="48" class="num text" font-size="20">3.523 kWh</text>
      <text x="235" y="68" class="num muted" font-size="11">944 € · 26.80 ct/kWh</text>

      <rect x="442" width="207" height="80" class="card" rx="10"/>
      <line x1="442" y1="2" x2="562" y2="2" stroke="#8b5cf6" stroke-width="2"/>
      <text x="456" y="20" class="muted" font-size="10" letter-spacing=".5">🌍 CO₂ PROGNOSE</text>
      <text x="456" y="48" class="num text" font-size="20">5.405 kg</text>
      <text x="456" y="68" class="num muted" font-size="11">4.064 Gas · 1.339 Strom</text>

      <rect x="663" width="192" height="80" class="card" rx="10"/>
      <line x1="663" y1="2" x2="783" y2="2" stroke="#4a90e2" stroke-width="2"/>
      <text x="677" y="20" class="muted" font-size="10" letter-spacing=".5">💶 Σ KOSTEN</text>
      <text x="677" y="48" class="num text" font-size="20">2.930 €</text>
      <text x="677" y="68" class="num muted" font-size="11">12 Monate</text>
    </g>

    <!-- Forecast charts (2-up) -->
    <g transform="translate(0,378)">
      <rect width="420" height="284" class="card" rx="10"/>
      <text x="14" y="22" class="muted" font-size="11" letter-spacing=".5">🔥 GAS — PROGNOSE</text>
      <g transform="translate(20,46)">
        <line x1="0" y1="0" x2="380" y2="0" class="border" stroke-dasharray="2,2"/>
        <line x1="0" y1="50" x2="380" y2="50" class="border" stroke-dasharray="2,2"/>
        <line x1="0" y1="100" x2="380" y2="100" class="border" stroke-dasharray="2,2"/>
        <line x1="0" y1="150" x2="380" y2="150" class="border" stroke-dasharray="2,2"/>

        <!-- Historic (gray) -->
        <polyline points="0,140 32,135 64,130 96,140 128,150"
                  stroke="#6b7f99" stroke-width="1.5" fill="none"/>
        <!-- Forecast (orange) -->
        <polyline points="128,150 160,138 192,118 224,80 256,40 288,15 320,30 352,80"
                  stroke="#ff7b2e" stroke-width="2.5" fill="none"/>
        <!-- Confidence band -->
        <polygon points="128,150 160,138 192,118 224,80 256,40 288,15 320,30 352,80 352,100 320,50 288,35 256,60 224,100 192,138 160,158 128,170"
                 fill="rgba(255,123,46,.12)"/>

        <line x1="128" y1="0" x2="128" y2="160" stroke="#4a90e2" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="130" y="10" class="blue" font-size="9">heute</text>

        <g class="muted num" font-size="9">
          <text x="0" y="178" text-anchor="middle">Mai</text>
          <text x="64" y="178" text-anchor="middle">Aug</text>
          <text x="128" y="178" text-anchor="middle">Nov</text>
          <text x="192" y="178" text-anchor="middle">Feb</text>
          <text x="256" y="178" text-anchor="middle">Mai</text>
          <text x="320" y="178" text-anchor="middle">Aug</text>
          <text x="380" y="178" text-anchor="end">Nov</text>
        </g>
      </g>

      <!-- Mini table preview -->
      <g transform="translate(14,250)" font-size="10" class="muted num">
        <text>2026-05</text>
        <text x="80" text-anchor="end">812 kWh</text>
        <text x="160" text-anchor="end">75 €</text>
        <text x="220" text-anchor="end">145 € Abschl.</text>
        <text x="320" text-anchor="end" class="strom">−70 € Saldo</text>
      </g>

      <rect x="435" width="420" height="284" class="card" rx="10"/>
      <text x="449" y="22" class="muted" font-size="11" letter-spacing=".5">⚡ STROM — PROGNOSE</text>
      <g transform="translate(455,46)">
        <line x1="0" y1="0" x2="380" y2="0" class="border" stroke-dasharray="2,2"/>
        <line x1="0" y1="50" x2="380" y2="50" class="border" stroke-dasharray="2,2"/>
        <line x1="0" y1="100" x2="380" y2="100" class="border" stroke-dasharray="2,2"/>
        <line x1="0" y1="150" x2="380" y2="150" class="border" stroke-dasharray="2,2"/>

        <polyline points="0,90 32,88 64,90 96,92 128,90"
                  stroke="#6b7f99" stroke-width="1.5" fill="none"/>
        <polyline points="128,90 160,88 192,84 224,72 256,68 288,72 320,80 352,88"
                  stroke="#2de8a4" stroke-width="2.5" fill="none"/>
        <polygon points="128,90 160,88 192,84 224,72 256,68 288,72 320,80 352,88 352,108 320,100 288,92 256,88 224,92 192,104 160,108 128,110"
                 fill="rgba(45,232,164,.12)"/>

        <line x1="128" y1="0" x2="128" y2="160" stroke="#4a90e2" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="130" y="10" class="blue" font-size="9">heute</text>

        <g class="muted num" font-size="9">
          <text x="0" y="178" text-anchor="middle">Mai</text>
          <text x="64" y="178" text-anchor="middle">Aug</text>
          <text x="128" y="178" text-anchor="middle">Nov</text>
          <text x="192" y="178" text-anchor="middle">Feb</text>
          <text x="256" y="178" text-anchor="middle">Mai</text>
          <text x="320" y="178" text-anchor="middle">Aug</text>
          <text x="380" y="178" text-anchor="end">Nov</text>
        </g>
      </g>

      <g transform="translate(449,250)" font-size="10" class="muted num">
        <text>2026-05</text>
        <text x="80" text-anchor="end">280 kWh</text>
        <text x="160" text-anchor="end">75 €</text>
        <text x="220" text-anchor="end">85 € Abschl.</text>
        <text x="320" text-anchor="end" class="strom">−10 € Saldo</text>
      </g>
    </g>
  </g>
</svg>
