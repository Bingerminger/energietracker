<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .bg{fill:#080c12}
      .topbar{fill:#111827}
      .card{fill:#111827;stroke:rgba(255,255,255,.07)}
      .border{stroke:rgba(255,255,255,.07);fill:none}
      .text{fill:#dce8f5}
      .muted{fill:#6b7f99}
      .dim{fill:#3d5070}
      .gas{fill:#ff7b2e}
      .strom{fill:#2de8a4}
      .blue{fill:#4a90e2}
      .yellow{fill:#f5c842}
      .red{fill:#ef4444}
      .num{font-family:'DM Mono',ui-monospace,monospace}
    </style>
  </defs>

  <rect class="bg" width="1100" height="720"/>
  <rect class="topbar" width="1100" height="48"/>
  <rect class="topbar" x="0" y="48" width="200" height="672"/>

  <!-- Sidebar -->
  <text x="20" y="78" class="dim" font-size="9" letter-spacing="1.2">ANALYSE</text>
  <rect x="12" y="86" width="176" height="34" rx="6" fill="#1c2636"/>
  <rect x="12" y="86" width="2" height="34" class="blue"/>
  <text x="50" y="107" class="text" font-size="13" font-weight="500">Korrelation</text>
  <text x="50" y="138" class="muted" font-size="13">Prognose</text>

  <g transform="translate(220,72)">
    <text class="text" font-size="20" font-weight="700">📊 Korrelationsanalyse</text>
    <text y="22" class="muted" font-size="12">4 Regressionsmodelle · Anomalien · Witterungsbereinigung</text>

    <!-- Regression model summaries (2 cards) -->
    <g transform="translate(0,52)">
      <rect width="420" height="160" class="card" rx="10"/>
      <text x="14" y="22" class="muted" font-size="11" letter-spacing=".5">🔥 REGRESSIONSMODELLE</text>

      <g transform="translate(14,46)" font-size="12">
        <text class="muted">Linear ★</text>
        <text x="406" text-anchor="end" class="num text">R² = 0.9668</text>
        <line x1="0" y1="14" x2="406" y2="14" class="border"/>
        <text y="36" class="muted">Polynomial</text>
        <text x="406" y="36" text-anchor="end" class="num text">R² = 0.9682</text>
        <line x1="0" y1="50" x2="406" y2="50" class="border"/>
        <text y="72" class="muted">Robust</text>
        <text x="406" y="72" text-anchor="end" class="num text">R² = 0.9667</text>
        <line x1="0" y1="86" x2="406" y2="86" class="border"/>
        <text y="108" class="muted">Segmentiert</text>
        <text x="406" y="108" text-anchor="end" class="num text">R² = 0.9669</text>
      </g>
      <text x="14" y="148" class="muted" font-size="10">Bestes: <tspan class="yellow" font-weight="600">Polynomial</tspan> · 30 Datenpunkte · 4 Anomalien</text>

      <rect x="435" width="420" height="160" class="card" rx="10"/>
      <text x="449" y="22" class="muted" font-size="11" letter-spacing=".5">⚡ REGRESSIONSMODELLE</text>
      <g transform="translate(449,46)" font-size="12">
        <text class="muted">Linear</text>
        <text x="406" text-anchor="end" class="num text">R² = 0.7234</text>
        <line x1="0" y1="14" x2="406" y2="14" class="border"/>
        <text y="36" class="muted">Polynomial</text>
        <text x="406" y="36" text-anchor="end" class="num text">R² = 0.7341</text>
        <line x1="0" y1="50" x2="406" y2="50" class="border"/>
        <text y="72" class="muted">Robust ★</text>
        <text x="406" y="72" text-anchor="end" class="num text">R² = 0.7298</text>
        <line x1="0" y1="86" x2="406" y2="86" class="border"/>
        <text y="108" class="muted">Segmentiert</text>
        <text x="406" y="108" text-anchor="end" class="num text">R² = 0.7156</text>
      </g>
      <text x="449" y="148" class="muted" font-size="10">Bestes: <tspan class="yellow" font-weight="600">Robust</tspan> · 28 Datenpunkte · 1 Anomalie</text>
    </g>

    <!-- Scatter plot (HGT vs Verbrauch) -->
    <g transform="translate(0,228)">
      <rect width="855" height="280" class="card" rx="10"/>
      <text x="14" y="22" class="muted" font-size="11" letter-spacing=".5">🔥 HGT VS. VERBRAUCH</text>

      <!-- Model tabs -->
      <g transform="translate(14,40)">
        <rect width="270" height="26" rx="6" fill="#1c2636"/>
        <rect x="3" y="3" width="65" height="20" rx="4" fill="#2563eb"/>
        <text x="35" y="17" fill="#fff" font-size="11" text-anchor="middle">Linear</text>
        <text x="103" y="17" class="muted" font-size="11" text-anchor="middle">Polynomial<tspan class="yellow" font-size="9">★</tspan></text>
        <text x="170" y="17" class="muted" font-size="11" text-anchor="middle">Robust</text>
        <text x="235" y="17" class="muted" font-size="11" text-anchor="middle">Segmentiert</text>
      </g>

      <!-- Plot -->
      <g transform="translate(60,80)">
        <!-- Grid -->
        <g class="border" stroke-dasharray="2,2">
          <line x1="0" y1="0" x2="760" y2="0"/>
          <line x1="0" y1="40" x2="760" y2="40"/>
          <line x1="0" y1="80" x2="760" y2="80"/>
          <line x1="0" y1="120" x2="760" y2="120"/>
          <line x1="0" y1="160" x2="760" y2="160"/>
        </g>

        <!-- Y axis labels -->
        <g class="muted num" font-size="9">
          <text x="-8" y="3" text-anchor="end">3000</text>
          <text x="-8" y="43" text-anchor="end">2250</text>
          <text x="-8" y="83" text-anchor="end">1500</text>
          <text x="-8" y="123" text-anchor="end">750</text>
          <text x="-8" y="163" text-anchor="end">0</text>
        </g>

        <!-- Regression line (linear) -->
        <line x1="20" y1="160" x2="730" y2="6" stroke="#4a90e2" stroke-width="2"/>

        <!-- Scatter points (some on the line, some scattered) -->
        <g fill="rgba(255,123,46,.7)" stroke="#ff7b2e">
          <circle cx="30" cy="158" r="4"/>
          <circle cx="55" cy="155" r="4"/>
          <circle cx="80" cy="150" r="4"/>
          <circle cx="120" cy="145" r="4"/>
          <circle cx="180" cy="125" r="4"/>
          <circle cx="220" cy="115" r="4"/>
          <circle cx="270" cy="100" r="4"/>
          <circle cx="320" cy="88" r="4"/>
          <circle cx="370" cy="75" r="4"/>
          <circle cx="420" cy="65" r="4"/>
          <circle cx="470" cy="55" r="4"/>
          <circle cx="520" cy="40" r="4"/>
          <circle cx="570" cy="35" r="4"/>
          <circle cx="620" cy="22" r="4"/>
          <circle cx="680" cy="15" r="4"/>
          <!-- Outliers -->
          <circle cx="200" cy="60" r="4"/>
          <circle cx="450" cy="115" r="4"/>
        </g>

        <!-- X axis labels -->
        <g class="muted num" font-size="9">
          <text x="0" y="180">0</text>
          <text x="190" y="180">150</text>
          <text x="380" y="180">300</text>
          <text x="570" y="180">450</text>
          <text x="760" y="180" text-anchor="end">600</text>
          <text x="380" y="200" text-anchor="middle">Heizgradtage</text>
        </g>
      </g>
      <text x="430" y="270" class="muted num" font-size="11" text-anchor="middle">kWh = 11.86 × HGT + 1023 · R² = 0.9668 · n = 30</text>
    </g>

    <!-- Anomaly table -->
    <g transform="translate(0,524)">
      <rect width="855" height="180" class="card" rx="10"/>
      <text x="14" y="22" class="muted" font-size="11" letter-spacing=".5">🚨 ANOMALIEN GAS (VOM BESTEN MODELL)</text>

      <line x1="14" y1="44" x2="841" y2="44" class="border"/>
      <g transform="translate(20,60)" class="dim" font-size="10" letter-spacing=".5">
        <text>MONAT</text>
        <text x="230" text-anchor="end">KWH</text>
        <text x="350" text-anchor="end">ERWARTET</text>
        <text x="500" text-anchor="end">Δ</text>
        <text x="610" text-anchor="end">σ</text>
        <text x="700">ART</text>
      </g>
      <line x1="14" y1="68" x2="841" y2="68" class="border"/>

      <g transform="translate(20,86)" font-size="11">
        <rect x="-6" y="-12" width="827" height="24" fill="rgba(239,68,68,.04)"/>
        <line x1="-6" y1="-12" x2="-6" y2="12" class="red" stroke-width="2"/>
        <text class="text" font-weight="600">Mär 2025</text>
        <text x="230" text-anchor="end" class="num text" font-weight="600">3.304</text>
        <text x="350" text-anchor="end" class="num muted">2.794</text>
        <text x="500" text-anchor="end" class="num red">+510 (+18.3%)</text>
        <text x="610" text-anchor="end" class="num">+2.23</text>
        <rect x="700" y="-10" width="84" height="16" rx="8" fill="rgba(239,68,68,.12)"/>
        <text x="708" y="2" class="red" font-size="10" font-weight="600">↑ erhöht</text>
      </g>

      <g transform="translate(20,114)" font-size="11">
        <rect x="-6" y="-12" width="827" height="24" fill="rgba(239,68,68,.04)"/>
        <line x1="-6" y1="-12" x2="-6" y2="12" class="red" stroke-width="2"/>
        <text class="text" font-weight="600">Feb 2026</text>
        <text x="230" text-anchor="end" class="num text" font-weight="600">2.805</text>
        <text x="350" text-anchor="end" class="num muted">3.296</text>
        <text x="500" text-anchor="end" class="num strom">−491 (−14.9%)</text>
        <text x="610" text-anchor="end" class="num">−2.15</text>
        <rect x="700" y="-10" width="86" height="16" rx="8" fill="rgba(45,232,164,.1)"/>
        <text x="708" y="2" class="strom" font-size="10" font-weight="600">↓ niedrig</text>
      </g>

      <g transform="translate(20,142)" font-size="11">
        <rect x="-6" y="-12" width="827" height="24" fill="rgba(239,68,68,.04)"/>
        <line x1="-6" y1="-12" x2="-6" y2="12" class="red" stroke-width="2"/>
        <text class="text" font-weight="600">Feb 2025</text>
        <text x="230" text-anchor="end" class="num text" font-weight="600">3.192</text>
        <text x="350" text-anchor="end" class="num muted">3.653</text>
        <text x="500" text-anchor="end" class="num strom">−461 (−12.6%)</text>
        <text x="610" text-anchor="end" class="num">−2.02</text>
        <rect x="700" y="-10" width="86" height="16" rx="8" fill="rgba(45,232,164,.1)"/>
        <text x="708" y="2" class="strom" font-size="10" font-weight="600">↓ niedrig</text>
      </g>
    </g>
  </g>
</svg>
