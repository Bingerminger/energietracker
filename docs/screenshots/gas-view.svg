<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .bg{fill:#080c12}
      .topbar{fill:#111827}
      .card{fill:#111827;stroke:rgba(255,255,255,.07)}
      .border{stroke:rgba(255,255,255,.07);fill:none}
      .text{fill:#dce8f5}
      .muted{fill:#6b7f99}
      .dim{fill:#3d5070}
      .gas{fill:#ff7b2e}
      .strom{fill:#2de8a4}
      .blue{fill:#4a90e2}
      .yellow{fill:#f5c842}
      .red{fill:#ef4444}
      .violet{fill:#8b5cf6}
      .num{font-family:'DM Mono',ui-monospace,monospace}
    </style>
  </defs>

  <rect class="bg" width="1100" height="760"/>
  <rect class="topbar" width="1100" height="48"/>
  <rect class="topbar" x="0" y="48" width="200" height="712"/>

  <!-- Sidebar collapsed -->
  <text x="20" y="78" class="dim" font-size="9" letter-spacing="1.2">VERBRAUCH</text>
  <rect x="12" y="86" width="176" height="34" rx="6" fill="#1c2636"/>
  <rect x="12" y="86" width="2" height="34" class="gas"/>
  <text x="50" y="107" class="text" font-size="13" font-weight="500">Gas</text>
  <rect x="22" y="92" width="22" height="22" rx="4" fill="#243044"/>
  <text x="29" y="107" font-size="11">🔥</text>
  <text x="50" y="138" class="muted" font-size="13">Strom</text>
  <text x="50" y="167" class="muted" font-size="13">Wasser</text>
  <text x="50" y="196" class="muted" font-size="13">Temperaturen</text>

  <g transform="translate(220,72)">
    <!-- Header -->
    <text class="text" font-size="20" font-weight="700"><tspan class="gas">🔥</tspan> Gas</text>
    <text y="22" class="muted" font-size="12">Zählerstände · Monatsverbrauch · CO₂</text>
    <g transform="translate(700,2)">
      <rect width="80" height="22" rx="4" fill="#1c2636" stroke="rgba(255,255,255,.12)"/>
      <text x="14" y="16" class="muted" font-size="11">📥 Export</text>
      <rect x="90" width="80" height="22" rx="4" fill="rgba(255,123,46,.15)" stroke="rgba(255,123,46,.3)"/>
      <text x="98" y="16" class="gas" font-size="11" font-weight="500">+ Ablesung</text>
    </g>

    <!-- Status banner -->
    <g transform="translate(0,42)">
      <rect width="855" height="48" rx="8" fill="rgba(45,232,164,.1)" stroke="rgba(45,232,164,.3)"/>
      <text x="18" y="32" font-size="20">✓</text>
      <text x="50" y="26" class="strom" font-size="13" font-weight="600">Letzte Ablesung vor 35 Tagen</text>
      <text x="50" y="42" class="strom" font-size="11">2026-04-03 · 3-Monats-Trend −8.5%</text>
    </g>

    <!-- Year pills -->
    <g transform="translate(0,108)">
      <rect width="50" height="26" rx="13" fill="none" stroke="rgba(255,255,255,.12)"/>
      <text x="25" y="18" class="muted" font-size="12" text-anchor="middle">2023</text>
      <rect x="56" width="50" height="26" rx="13" fill="none" stroke="rgba(255,255,255,.12)"/>
      <text x="81" y="18" class="muted" font-size="12" text-anchor="middle">2024</text>
      <rect x="112" width="50" height="26" rx="13" fill="rgba(255,123,46,.7)"/>
      <text x="137" y="18" fill="#fff" font-size="12" text-anchor="middle">2025</text>
      <rect x="168" width="50" height="26" rx="13" fill="none" stroke="rgba(255,255,255,.12)"/>
      <text x="193" y="18" class="muted" font-size="12" text-anchor="middle">2026</text>
    </g>

    <!-- KPIs -->
    <g transform="translate(0,148)">
      <rect width="207" height="80" class="card" rx="10"/>
      <line x1="0" y1="2" x2="120" y2="2" stroke="#ff7b2e" stroke-width="2"/>
      <text x="14" y="20" class="muted" font-size="10" letter-spacing=".7">🔥 VERBRAUCH 2025</text>
      <text x="14" y="48" class="num text" font-size="20">19.661 kWh</text>
      <text x="14" y="68" class="num muted" font-size="11">1.710 m³</text>

      <rect x="221" width="207" height="80" class="card" rx="10"/>
      <line x1="221" y1="2" x2="341" y2="2" stroke="#ff7b2e" stroke-width="2"/>
      <text x="235" y="20" class="muted" font-size="10" letter-spacing=".7">💶 KOSTEN 2025</text>
      <text x="235" y="48" class="num text" font-size="20">1.794,68 €</text>
      <text x="235" y="68" class="num muted" font-size="11">∅ 149,56 €/Monat</text>

      <rect x="442" width="207" height="80" class="card" rx="10"/>
      <line x1="442" y1="2" x2="562" y2="2" stroke="#f5c842" stroke-width="2"/>
      <text x="456" y="20" class="muted" font-size="10" letter-spacing=".7">💰 ABSCHLÄGE 2025</text>
      <text x="456" y="48" class="num text" font-size="20">1.945,00 €</text>
      <text x="456" y="68" class="num strom" font-size="11">Saldo Jahr −150,32 €</text>

      <rect x="663" width="192" height="80" class="card" rx="10"/>
      <line x1="663" y1="2" x2="783" y2="2" stroke="#8b5cf6" stroke-width="2"/>
      <text x="677" y="20" class="muted" font-size="10" letter-spacing=".7">🌍 CO₂ 2025</text>
      <text x="677" y="48" class="num text" font-size="20">3.952 kg</text>
      <text x="677" y="68" class="num muted" font-size="11">3.95 t</text>
    </g>

    <!-- Balance KPI card -->
    <g transform="translate(0,244)">
      <rect width="855" height="160" class="card" rx="10"/>
      <line x1="0" y1="0" x2="0" y2="160" stroke="#ff7b2e" stroke-width="3"/>
      <text x="14" y="22" class="muted" font-size="11" letter-spacing=".5">⚖️ SALDO AKTUELLER VERTRAG — E.ON</text>
      <text x="14" y="42" class="num muted" font-size="11">9.2000 ct/kWh · 10.50 €/Monat · Abschlag 145.00 €</text>

      <!-- 4-column grid -->
      <g transform="translate(20,68)">
        <text class="muted" font-size="10" letter-spacing=".7">VERBRAUCHT (STAND HEUTE)</text>
        <text y="28" class="num text" font-size="18">1.666,64 €</text>
        <text y="48" class="muted" font-size="11">11 Monate · 18.920 kWh</text>
        <text y="62" class="num dim" font-size="10">1.741 € Verbrauch + 116 € Grundpreis − 200 € Bonus</text>

        <text x="220" class="muted" font-size="10" letter-spacing=".7">ABSCHLAG BEZAHLT</text>
        <text x="220" y="28" class="num text" font-size="18">1.780,00 €</text>
        <text x="220" y="48" class="muted" font-size="11">aktuell: 145.00 €/Monat</text>

        <text x="430" class="muted" font-size="10" letter-spacing=".7">AKTUELLER SALDO</text>
        <text x="430" y="28" class="num strom" font-size="18">−113.36 €</text>
        <text x="430" y="48" class="muted" font-size="11">Überzahlt</text>

        <!-- Verdict box -->
        <rect x="630" y="-12" width="200" height="92" rx="8" fill="rgba(45,232,164,.08)" stroke="rgba(45,232,164,.3)"/>
        <text x="644" y="6" class="muted" font-size="10" letter-spacing=".7">↓ ERWARTET BEI ABRECHNUNG</text>
        <text x="644" y="34" class="num strom" font-size="20" font-weight="600">−113.36 €</text>
        <text x="644" y="54" class="strom" font-size="11" font-weight="600">Erstattung</text>
        <text x="644" y="72" class="muted" font-size="10">Vertragsende: 2026-04-30</text>
      </g>
    </g>

    <!-- Contracts card -->
    <g transform="translate(0,420)">
      <rect width="855" height="240" class="card" rx="10"/>
      <text x="14" y="22" class="muted" font-size="11" letter-spacing=".5">📑 VERTRÄGE &amp; ABSCHLÄGE</text>
      <rect x="730" y="10" width="116" height="22" rx="4" fill="#1c2636" stroke="rgba(255,255,255,.12)"/>
      <text x="742" y="25" class="muted" font-size="11">+ Neuer Vertrag</text>

      <!-- Table headers -->
      <line x1="14" y1="44" x2="841" y2="44" class="border"/>
      <g transform="translate(20,60)" class="dim" font-size="10" letter-spacing=".7">
        <text>ANBIETER / TARIF</text>
        <text x="200">ZEITRAUM</text>
        <text x="320">STATUS</text>
        <text x="408" text-anchor="end">TARIF</text>
        <text x="490" text-anchor="end">VERBRAUCHT</text>
        <text x="585" text-anchor="end">BEZAHLT</text>
        <text x="660" text-anchor="end">SALDO</text>
        <text x="745" text-anchor="end">ERWARTET</text>
      </g>
      <line x1="14" y1="68" x2="841" y2="68" class="border"/>

      <!-- Row 1 -->
      <g transform="translate(20,86)">
        <text class="text" font-size="12" font-weight="600">Stadtwerke Leipzig</text>
        <text y="16" class="muted" font-size="11">Erdgas Klassik</text>
        <text x="200" y="6" class="num muted" font-size="10">2023-05-01</text>
        <text x="200" y="22" class="num muted" font-size="10">→ 2024-04-30</text>
        <rect x="320" y="-4" width="78" height="16" rx="8" fill="#243044"/>
        <text x="328" y="7" class="muted" font-size="9" font-weight="600">VERGANGEN</text>
        <text x="408" text-anchor="end" class="num muted" font-size="10">12.0000 ct</text>
        <text x="490" text-anchor="end" class="num text" font-size="11">2.744,13 €</text>
        <text x="585" text-anchor="end" class="num text" font-size="11">2.260,00 €</text>
        <text x="660" text-anchor="end" class="num red" font-size="11">+484,13 €</text>
        <text x="745" text-anchor="end" class="num red" font-size="11" font-weight="600">+484,13 €</text>
      </g>
      <line x1="14" y1="120" x2="841" y2="120" class="border"/>

      <!-- Row 2 -->
      <g transform="translate(20,138)">
        <text class="text" font-size="12" font-weight="600">Vattenfall</text>
        <text y="16" class="muted" font-size="11">Easy12 Erdgas</text>
        <text x="200" y="6" class="num muted" font-size="10">2024-05-01</text>
        <text x="200" y="22" class="num muted" font-size="10">→ 2025-04-30</text>
        <rect x="320" y="-4" width="78" height="16" rx="8" fill="#243044"/>
        <text x="328" y="7" class="muted" font-size="9" font-weight="600">VERGANGEN</text>
        <text x="408" text-anchor="end" class="num muted" font-size="10">9.8000 ct</text>
        <text x="490" text-anchor="end" class="num text" font-size="11">1.892,43 €</text>
        <text x="585" text-anchor="end" class="num text" font-size="11">1.980,00 €</text>
        <text x="660" text-anchor="end" class="num strom" font-size="11">−87,57 €</text>
        <text x="745" text-anchor="end" class="num strom" font-size="11" font-weight="600">−87,57 €</text>
      </g>
      <line x1="14" y1="172" x2="841" y2="172" class="border"/>

      <!-- Row 3 (active) -->
      <g transform="translate(20,190)">
        <text class="text" font-size="12" font-weight="600">E.ON</text>
        <text y="16" class="muted" font-size="11">GasMix Aktiv</text>
        <text x="200" y="6" class="num muted" font-size="10">2025-05-01</text>
        <text x="200" y="22" class="num muted" font-size="10">→ 2026-04-30</text>
        <rect x="320" y="-4" width="48" height="16" rx="8" fill="rgba(45,232,164,.1)"/>
        <text x="328" y="7" class="strom" font-size="9" font-weight="600">AKTIV</text>
        <text x="408" text-anchor="end" class="num muted" font-size="10">9.2000 ct</text>
        <text x="490" text-anchor="end" class="num text" font-size="11">1.666,64 €</text>
        <text x="585" text-anchor="end" class="num text" font-size="11">1.780,00 €</text>
        <text x="660" text-anchor="end" class="num strom" font-size="11">−113,36 €</text>
        <text x="745" text-anchor="end" class="num strom" font-size="11" font-weight="600">−113,36 €</text>
      </g>
    </g>
  </g>
</svg>
