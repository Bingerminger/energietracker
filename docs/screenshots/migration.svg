<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="-apple-system, system-ui, sans-serif">
  <defs>
    <style>
      .bg{fill:#080c12}
      .topbar{fill:#111827}
      .card{fill:#111827;stroke:rgba(255,255,255,.07)}
      .modal{fill:#0d141f;stroke:rgba(255,255,255,.15)}
      .overlay{fill:rgba(8,12,18,.55)}
      .border{stroke:rgba(255,255,255,.07);fill:none}
      .text{fill:#dce8f5}
      .muted{fill:#6b7f99}
      .dim{fill:#3d5070}
      .gas{fill:#ff7b2e}
      .strom{fill:#2de8a4}
      .blue{fill:#4a90e2}
      .yellow{fill:#f5c842}
      .num{font-family:'DM Mono',ui-monospace,monospace}
    </style>
  </defs>

  <!-- Backdrop -->
  <rect class="bg" width="1100" height="700"/>
  <rect class="topbar" width="1100" height="48"/>
  <rect class="topbar" x="0" y="48" width="200" height="652"/>

  <!-- Sidebar (System → Einstellungen active) -->
  <text x="20" y="78" class="dim" font-size="9" letter-spacing="1.2">SYSTEM</text>
  <rect x="12" y="86" width="176" height="34" rx="6" fill="#1c2636"/>
  <rect x="12" y="86" width="2" height="34" class="blue"/>
  <text x="50" y="107" class="text" font-size="13" font-weight="500">Einstellungen</text>
  <rect x="22" y="92" width="22" height="22" rx="4" fill="#243044"/>
  <text x="29" y="107" font-size="11">⚙️</text>

  <!-- Faded background view -->
  <g opacity="0.35">
    <g transform="translate(220,72)">
      <text class="text" font-size="20" font-weight="700">⚙️ Einstellungen</text>
      <rect y="42" width="855" height="80" class="card" rx="10"/>
      <text x="14" y="64" class="muted" font-size="11">Backup &amp; Restore</text>
    </g>
  </g>

  <!-- Modal overlay -->
  <rect class="overlay" width="1100" height="700"/>

  <!-- Migration modal -->
  <g transform="translate(140,60)">
    <rect class="modal" width="820" height="580" rx="12"/>

    <!-- Header -->
    <text x="24" y="34" class="text" font-size="16" font-weight="700">📦 Migration aus v0.9.0</text>
    <text x="788" y="34" class="muted" font-size="20" text-anchor="end">×</text>
    <line x1="0" y1="54" x2="820" y2="54" class="border"/>

    <!-- Body -->
    <g transform="translate(0,76)">
      <text x="24" y="0" class="text" font-size="13">
        Erkanntes <tspan font-weight="700">v0.9.0-Backup-Format 2.1</tspan>.
      </text>
      <text x="24" y="18" class="muted" font-size="13">
        Daten wurden auf das v1.0.2-Schema übersetzt (noch nicht geschrieben).
      </text>

      <!-- Stats box -->
      <rect x="24" y="36" width="772" height="120" rx="8" fill="#162130"/>
      <text x="42" y="58" class="dim" font-size="10" letter-spacing=".7">WAS IMPORTIERT WÜRDE</text>

      <!-- Table -->
      <g transform="translate(42,76)" font-size="12">
        <text class="muted">Ablesungen</text>
        <text x="540" text-anchor="end" class="num text">52</text>
        <text x="630" text-anchor="end" class="num text">22</text>
        <text x="720" text-anchor="end" class="num muted">0</text>
        <line x1="0" y1="10" x2="720" y2="10" class="border"/>
        <text y="30" class="muted">Verträge</text>
        <text x="540" y="30" text-anchor="end" class="num text">8</text>
        <text x="630" y="30" text-anchor="end" class="num text">4</text>
        <text x="720" y="30" text-anchor="end" class="num muted">0</text>
        <!-- column headers -->
        <text x="540" y="-18" text-anchor="end" class="gas" font-size="10" font-weight="600">GAS</text>
        <text x="630" y="-18" text-anchor="end" class="strom" font-size="10" font-weight="600">STROM</text>
        <text x="720" y="-18" text-anchor="end" class="blue" font-size="10" font-weight="600">WASSER</text>
      </g>
      <text x="42" y="138" class="muted num" font-size="11">1131 Temperaturtage · 20 Settings-Keys</text>

      <!-- Warning banner -->
      <rect x="24" y="172" width="772" height="36" rx="6" fill="rgba(245,200,66,.08)" stroke="rgba(245,200,66,.3)"/>
      <text x="42" y="195" class="yellow" font-size="12">⚠ v0.9.0 kennt kein Wasser — der Wasser-Utility-Bereich wird leer angelegt.</text>

      <!-- Candidates expander -->
      <g transform="translate(24,228)">
        <text class="muted" font-size="12">▾ <tspan font-weight="600" class="text">1 möglicher Zählerwechsel erkannt</tspan> — nach dem Import als Device-Tausch nachpflegen?</text>
        <rect y="14" width="772" height="60" rx="6" fill="#0d141f" stroke="rgba(255,255,255,.05)"/>
        <g transform="translate(20,32)" font-size="11" class="num text">
          <text class="muted" font-size="10" letter-spacing=".5">UTILITY</text>
          <text x="120" class="muted" font-size="10" letter-spacing=".5">DATUM</text>
          <text x="260" class="muted" font-size="10" letter-spacing=".5" text-anchor="end">STAND</text>
          <text x="290" class="muted" font-size="10" letter-spacing=".5">KOMMENTAR</text>
          <line x1="0" y1="6" x2="730" y2="6" class="border"/>
          <text y="24">strom</text>
          <text x="120" y="24">2020-07-22</text>
          <text x="260" y="24" text-anchor="end">6</text>
          <text x="290" y="24" class="muted">Zählerwechsel</text>
        </g>
      </g>

      <!-- Mode selector -->
      <rect x="24" y="312" width="772" height="120" rx="8" fill="#162130"/>
      <text x="42" y="334" class="dim" font-size="10" letter-spacing=".7">WIE SCHREIBEN?</text>

      <!-- Replace option (selected) -->
      <g transform="translate(42,348)">
        <circle cx="6" cy="8" r="6" fill="#4a90e2"/>
        <circle cx="6" cy="8" r="2.5" fill="#fff"/>
        <text x="22" y="11" class="text" font-size="12" font-weight="600">Ersetzen</text>
        <text x="86" y="11" class="muted" font-size="12">— vorhandene v1.0.2-Daten werden gelöscht und durch das Backup ersetzt.</text>
        <text x="22" y="28" class="dim" font-size="11" font-style="italic">Vor dem Schreiben wird automatisch ein Sicherheits-Snapshot der aktuellen Daten unter data/backups/ abgelegt.</text>
      </g>

      <!-- Merge option -->
      <g transform="translate(42,392)">
        <circle cx="6" cy="8" r="6" fill="none" stroke="#6b7f99"/>
        <text x="22" y="11" class="text" font-size="12" font-weight="600">Zusammenführen</text>
        <text x="124" y="11" class="muted" font-size="12">— nur Ablesungen/Verträge mit neuer ID werden ergänzt.</text>
        <text x="22" y="28" class="muted" font-size="11">Bestehende Daten bleiben. Temperaturtage werden nur bei freiem Datum ergänzt.</text>
      </g>
    </g>

    <!-- Footer -->
    <line x1="0" y1="540" x2="820" y2="540" class="border"/>
    <g transform="translate(0,556)">
      <rect x="588" y="-6" width="92" height="28" rx="5" fill="#1c2636" stroke="rgba(255,255,255,.12)"/>
      <text x="634" y="12" class="muted" font-size="12" text-anchor="middle">Abbrechen</text>
      <rect x="688" y="-6" width="108" height="28" rx="5" fill="#4a90e2"/>
      <text x="742" y="12" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Importieren</text>
    </g>
  </g>
</svg>
