; Energietracker — php-fpm-Pool-Overrides für das Docker-Image (N1005/N1010).
; Wird als /usr/local/etc/php-fpm.d/zz-app.conf eingespielt (zz → lädt zuletzt).

[global]
; FPM-Master-Fehler nach Container-stderr.
error_log = /proc/self/fd/2

[www]
; Worker-Ausgabe (u. a. die JSON-Lines des N1010-Loggers via php://stderr)
; vom Master einsammeln und unverändert nach stderr durchreichen.
catch_workers_output = yes
decorate_workers_output = no

; WICHTIG: Container-Umgebungsvariablen an PHP durchreichen. Ohne dies
; (FPM-Default clear_env=yes) sähe getenv('ET_DATA_DIR' / 'ET_LOG_*') nichts.
clear_env = no
