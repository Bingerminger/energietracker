; Energietracker — supervisord für das Single-Container-Image (N1005).
; Hält php-fpm und nginx im selben Container am Leben. Beide loggen nach
; stdout/stderr, damit `docker logs` (und damit auch der JSON-Lines-Logger
; aus N1010) alles einsammelt.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
