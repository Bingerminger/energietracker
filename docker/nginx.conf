# Energietracker — nginx-Konfiguration für das Docker-Image (N1005, v1.7.3).
#
# Spiegelt 1:1 das Verhalten von router.php (PHP-Built-in-Server / CI):
#   - statische Dateien direkt ausliefern
#   - /data und /src sowie roher PHP-Quelltext sind tabu
#   - /api(.php)/… → api.php mit SCRIPT_NAME=/api.php (Request strippt das
#     wieder, sodass sowohl /api/… als auch /api.php/api/… auf dieselbe
#     Route zeigen)
#   - alles andere → index.php (SPA-Shell-Fallback)

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # Backup-Import / CSV-Upload brauchen etwas Spielraum.
    client_max_body_size 32m;

    server {
        listen 80 default_server;
        server_name _;
        root /app;
        index index.php;

        # 1. /data und /src niemals ausliefern (wie nginx-Vorlage in INSTALL.md).
        location ~ ^/(data|src)/ {
            return 404;
        }

        # 2. API → api.php. Muss VOR der generischen .php-Sperre stehen.
        #    fastcgi_params setzt REQUEST_URI=$request_uri; SCRIPT_NAME/
        #    SCRIPT_FILENAME überschreiben wir danach bewusst auf api.php.
        location ~ ^/api(\.php)?(/|$) {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /app/api.php;
            fastcgi_param SCRIPT_NAME /api.php;
            fastcgi_read_timeout 60s;
        }

        # 3. Sonstigen PHP-Quelltext nicht roh ausliefern.
        location ~ \.php$ {
            return 404;
        }

        # 4. Anwendungscode und Sprachkataloge: immer revalidieren.
        #    Seit v2.3.1 tragen die Module über die Import-Map eine Version;
        #    diese Regel greift zusätzlich für Browser ohne Import-Map-Support.
        #    Ohne sie durfte der Browser heuristisch cachen — nach dem
        #    v2.3.0-Update lieferte Safari eine alte `api.js` aus, und der
        #    Tarifvergleich starb an einem fehlenden Export.
        location ~ ^/public/(js|locales)/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # 5. Schriften ändern sich praktisch nie und sind versioniert
        #    eingebunden — die dürfen lange liegen bleiben.
        location ~ \.(woff2?|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # 6. Statische Datei oder SPA-Fallback.
        location / {
            try_files $uri @spa;
        }

        location @spa {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }
    }
}
