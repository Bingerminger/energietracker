# Energietracker — nginx-Konfiguration für das Docker-Image (N1005, v1.7.3).
#
# Spiegelt 1:1 das Verhalten von router.php (PHP-Built-in-Server / CI):
#   - statische Dateien direkt ausliefern
#   - /data und /src sowie roher PHP-Quelltext sind tabu
#   - /api(.php)/… → api.php mit SCRIPT_NAME=/api.php (Request strippt das
#     wieder, sodass sowohl /api/… als auch /api.php/api/… auf dieselbe
#     Route zeigen)
#   - alles andere → index.php (SPA-Shell-Fallback)

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # v3.4.0 (N1020) — klein für alles, groß (256 MB wie post_max_size) nur
    # für Backup-Import, Belege und CSV-/Zeitreihen-Importe, s. die Location
    # unten. Bis v3.3 galten 256 MB überall, auch ohne Anmeldung: Wenige
    # parallele Anfragen brachten ein NAS an die Speichergrenze.
    client_max_body_size 8m;

    server {
        listen 80 default_server;
        server_name _;
        root /app;
        index index.php;

        # 1. /data und /src niemals ausliefern (wie nginx-Vorlage in INSTALL.md).
        location ~ ^/(data|src)/ {
            return 404;
        }

        # v2.6.0 — nur Auslieferungsgut: keine Punktdateien (.htaccess …), keine
        # Doku, Tests oder Konfiguration aus dem Image.
        location ~ /\. {
            return 404;
        }
        location ~ ^/(tests|docs|scripts|docker|vendor|demo-data|tools|dist|deploy)/ {
            return 404;
        }
        location ~* ^/[^/]+\.(md|json|lock|ya?ml|dist|txt|conf|sh|ini)$ {
            return 404;
        }
        location ~ ^/(Dockerfile|VERSION)$ {
            return 404;
        }

        # 2a. v3.4.0 (N1020) — große Körper nur hier: Backup-Import, Belege,
        #     CSV-/Zeitreihen-Importe. Dieselbe Liste prüft die App selbst
        #     (App::LARGE_BODY_ROUTES); WebrootRulesTest gleicht beide ab.
        #     v3.7.0 — dazu `inbox` (PDF in den Posteingang legen).
        location ~ ^/api(\.php/api)?/(backup/import|attachments|inbox|.+/import-(csv|series|evcc))$ {
            client_max_body_size 256m;
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /app/api.php;
            fastcgi_param SCRIPT_NAME /api.php;
            fastcgi_read_timeout 310s;
        }

        # 2b. v3.7.0 — Erkennen und Auslesen im Posteingang warten auf das
        #     KI-Modell, ein Cloud-Dienst bis 600 s. PHP hebt seine Grenze dafür
        #     auf InboxController::READ_TIME_LIMIT_S (660 s); nginx wartet hier
        #     genauso lange. Alle übrigen Routen bleiben bei 310 s.
        #     NginxReadTimeoutTest gleicht Routen und Zeit mit der App ab.
        location ~ ^/api(\.php/api)?/inbox/[^/]+/(classify|extract)$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /app/api.php;
            fastcgi_param SCRIPT_NAME /api.php;
            fastcgi_read_timeout 660s;
        }

        # 2. API → api.php. Muss VOR der generischen .php-Sperre stehen.
        #    fastcgi_params setzt REQUEST_URI=$request_uri; SCRIPT_NAME/
        #    SCRIPT_FILENAME überschreiben wir danach bewusst auf api.php.
        location ~ ^/api(\.php)?(/|$) {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /app/api.php;
            fastcgi_param SCRIPT_NAME /api.php;
            # v2.6.0 — große Importe; v3.1.0 — 310 s: die Texterkennung im
            # Heimnetz darf bis 300 s rechnen (ocr_timeout_s), auf einem NAS ohne
            # Grafikkarte kommt das vor. Warten auf curl zählt unter Linux nicht
            # in max_execution_time.
            fastcgi_read_timeout 310s;
        }

        # 3. Sonstigen PHP-Quelltext nicht roh ausliefern.
        location ~ \.php$ {
            return 404;
        }

        # 4. Anwendungscode und Sprachkataloge: immer revalidieren.
        #    Seit v2.3.1 tragen die Module über die Import-Map eine Version;
        #    diese Regel greift zusätzlich für Browser ohne Import-Map-Support.
        #    Ohne sie durfte der Browser heuristisch cachen — nach dem
        #    v2.3.0-Update lieferte Safari eine alte `api.js` aus, und der
        #    Tarifvergleich starb an einem fehlenden Export.
        location ~ ^/public/(js|locales)/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # 5. Schriften ändern sich praktisch nie und sind versioniert
        #    eingebunden — die dürfen lange liegen bleiben.
        location ~ \.(woff2?|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # 6. Statische Datei oder SPA-Fallback.
        location / {
            try_files $uri @spa;
        }

        location @spa {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }
    }
}
