# Energietracker — Zusatz zu nginx.conf im Image ohne root (N1024, v3.5.0).
# Wird im http-Block eingebunden (s. Dockerfile, Stufe `rootless`).
#
# Das Alpine-Paket legt die Zwischenspeicher unter /var/lib/nginx/tmp an;
# /var/lib/nginx gehört dort dem Benutzer nginx (Modus 750) und ist für jede
# andere UID unerreichbar. Ohne root liegen sie deshalb unter /tmp —
# beschreibbar für jede UID, mit `read_only: true` als tmpfs. nginx legt die
# Verzeichnisse beim Start selbst an.
client_body_temp_path /tmp/nginx-client-body;
fastcgi_temp_path     /tmp/nginx-fastcgi;
proxy_temp_path       /tmp/nginx-proxy;
scgi_temp_path        /tmp/nginx-scgi;
uwsgi_temp_path       /tmp/nginx-uwsgi;
