; Energietracker — php-fpm nur im Container erreichbar (v3.4.0, N1020).
;
; Das offizielle php-Image setzt in zz-docker.conf `listen = 9000`, also auf
; allen Schnittstellen. Andere Container im selben Docker-Netz — bei
; `network_mode: host` jedes Gerät im Netz — hätten FastCGI direkt erreicht,
; an jeder Anmeldung vorbei. Diese Datei wird als zzz-energietracker.conf
; eingespielt und lädt damit NACH zz-docker.conf (alphabetisch: „zzz" > „zz-").
; nginx spricht php-fpm ohnehin über 127.0.0.1:9000 an (docker/nginx.conf).

[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
