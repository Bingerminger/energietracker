; Energietracker — PHP-Einstellungen für das Docker-Image (v2.6.0).
; Bis v2.5.3 brachte das Image keine php.ini mit; es galten die PHP-Vorgaben
; (memory_limit 128M, post_max_size 8M, display_errors 1). Ein Backup mit
; 15 Jahren Tagesdaten ließ sich damit nicht zurückspielen, und eine Warnung
; landete vor dem JSON im Antwortkörper.

; v3.1.0 — Belege im Backup (base64): 256 MB Körper; der Import hält ihn
; dekodiert ein zweites Mal im Speicher, daher 768 MB als Obergrenze (nur
; beim Einspielen eines großen Backups wirklich gebraucht).
memory_limit = 768M
post_max_size = 256M
upload_max_filesize = 256M
max_execution_time = 120

display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Der Code im Image ändert sich nie — Zeitstempel müssen nicht geprüft werden.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
