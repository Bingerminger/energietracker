# leer lassen (die Bilder ergänzt das Umbrel-Team).
manifestVersion: 1
id: energietracker
category: finance
name: Energietracker
version: "3.1.0"
tagline: Meter readings, contracts and costs for energy and water
description: >-
  Record meter readings and fuel deliveries, keep supply contracts with prices and advance
  payments, and see weather-adjusted consumption, balance and forecasts for electricity, gas,
  water, district heating, heating oil, pellets and PV. Seven languages, no database — all data
  stays as JSON files on your Umbrel. Home Assistant can push readings and read values back.
