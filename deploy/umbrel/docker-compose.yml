# Energietracker — Umbrel-Vorlage (zu umbrel-app.yml). Der app_proxy hält die
# Umbrel-Anmeldung vor der App; nur der Home-Assistant-Push (/api/ingest) ist
# ohne Umbrel-Cookie erreichbar und braucht dann den Ingest-Token der App.
# Vor einer Einreichung das Image per Index-Digest pinnen.
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: energietracker_web_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/api/ingest,/api.php/api/ingest"

  web:
    image: ghcr.io/bingerminger/energietracker:3.1.0
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      ET_LOG_LEVEL: info
      ET_LOG_DEST: stderr
