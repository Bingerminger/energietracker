name: Docker Rebuild

# v3.4.0 (N1020) — Wöchentlicher Neubau des neuesten Release-Tags.
#
# docker-publish.yml baut nur beim Taggen. Wer `3.3.0` festschreibt, behielte
# sonst das Alpine und PHP vom Tag des Releases, samt später behobener Lücken.
# Dieser Lauf baut denselben Code jede Woche auf dem aktuellen Basis-Image
# neu (ohne Cache) und schiebt ihn unter denselben Namen (X.Y.Z, X.Y, latest).
# Danach durchsucht ein Scan das Image nach bekannten Lücken — nicht
# blockierend; die Treffer erscheinen unter Security → Code scanning.
on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Neuesten Release-Tag neu bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Neuesten Release-Tag auschecken
        id: tag
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          test -n "$TAG"
          git checkout --quiet "$TAG"
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "Neubau von $TAG"

      - name: QEMU einrichten (für arm64-Emulation beim Multi-Arch-Build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: An GHCR anmelden
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen & pushen (ohne Cache, aktuelles Basis-Image)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/bingerminger/energietracker:${{ steps.tag.outputs.version }}
            ghcr.io/bingerminger/energietracker:${{ steps.tag.outputs.minor }}
            ghcr.io/bingerminger/energietracker:latest
          labels: |
            org.opencontainers.image.title=Energietracker
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/Bingerminger/energietracker
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          provenance: true
          sbom: true

  scan:
    name: Image auf bekannte Lücken prüfen (nicht blockierend)
    needs: rebuild
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/bingerminger/energietracker:${{ needs.rebuild.outputs.version }}
          fail-build: false
          output-format: sarif

      - name: Ergebnis hochladen (Security → Code scanning)
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container-image
