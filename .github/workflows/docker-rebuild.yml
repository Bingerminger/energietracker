name: Docker Rebuild

# v3.4.0 (N1020) — Wöchentlicher Neubau des neuesten Release-Tags.
#
# docker-publish.yml baut nur beim Taggen. Wer `3.3.0` festschreibt, behielte
# sonst das Alpine und PHP vom Tag des Releases, samt später behobener Lücken.
# Dieser Lauf baut denselben Code jede Woche auf dem aktuellen Basis-Image
# neu (ohne Cache) und schiebt ihn unter denselben Namen (X.Y.Z, X.Y, X, latest).
# Danach durchsucht ein Scan das Image nach bekannten Lücken — nicht
# blockierend; die Treffer erscheinen unter Security → Code scanning.
# v3.5.0 (N1024) — ebenso die Variante ohne root (X.Y.Z-rootless, X.Y-rootless,
# X-rootless, latest-rootless), sobald der Release-Tag sie enthält; der Scan prüft beide.
# 2026-10-29 — X und X-rootless fehlten bis dahin, obwohl docker-compose.yml und
# INSTALL `:3` empfehlen: Wer `:3` nutzte, bekam die Wochen-Neubauten nicht.
on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Neuesten Release-Tag neu bauen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      version: ${{ steps.tag.outputs.version }}
      rootless: ${{ steps.tag.outputs.rootless }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Neuesten Release-Tag auschecken
        id: tag
        run: |
          TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          test -n "$TAG"
          git checkout --quiet "$TAG"
          VERSION=${TAG#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          # Releases vor v3.5.0 kennen das Ziel `rootless` noch nicht
          if grep -qE '^FROM .+ AS rootless$' Dockerfile; then
            echo "rootless=true" >> "$GITHUB_OUTPUT"
          else
            echo "rootless=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Neubau von $TAG"

      - name: QEMU einrichten (für arm64-Emulation beim Multi-Arch-Build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: An GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen & pushen (ohne Cache, aktuelles Basis-Image)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/bingerminger/energietracker:${{ steps.tag.outputs.version }}
            ghcr.io/bingerminger/energietracker:${{ steps.tag.outputs.minor }}
            ghcr.io/bingerminger/energietracker:${{ steps.tag.outputs.major }}
            ghcr.io/bingerminger/energietracker:latest
          labels: |
            org.opencontainers.image.title=Energietracker
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/Bingerminger/energietracker
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          provenance: true
          sbom: true

      - name: Bauen & pushen ohne root (ohne Cache, aktuelles Basis-Image)
        if: steps.tag.outputs.rootless == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: rootless
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/bingerminger/energietracker:${{ steps.tag.outputs.version }}-rootless
            ghcr.io/bingerminger/energietracker:${{ steps.tag.outputs.minor }}-rootless
            ghcr.io/bingerminger/energietracker:${{ steps.tag.outputs.major }}-rootless
            ghcr.io/bingerminger/energietracker:latest-rootless
          labels: |
            org.opencontainers.image.title=Energietracker
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/Bingerminger/energietracker
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}-rootless
          provenance: true
          sbom: true

  scan:
    name: Image auf bekannte Lücken prüfen (${{ matrix.variant }}, nicht blockierend)
    needs: rebuild
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kategorie des Standard-Images wie bis v3.4.0 (Verlauf der Treffer bleibt)
          - variant: standard
            suffix: ""
            category: container-image
          - variant: rootless
            suffix: "-rootless"
            category: container-image-rootless
    steps:
      - name: Scan (Grype)
        id: scan
        if: matrix.variant == 'standard' || needs.rebuild.outputs.rootless == 'true'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/bingerminger/energietracker:${{ needs.rebuild.outputs.version }}${{ matrix.suffix }}
          fail-build: false
          output-format: sarif

      - name: Ergebnis hochladen (Security → Code scanning)
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ matrix.category }}
