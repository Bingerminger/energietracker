name: Demo

# v3.0.0 — Die öffentliche Demo auf GitHub Pages: die App-Hülle ohne PHP, die
# Antworten vorberechnet vom echten Server (tools/build-demo.mjs). Gebaut wird
# immer aus dem neuesten Release-Tag — die Demo zeigt, was veröffentlicht ist,
# nicht den Stand von main:
#   • beim Veröffentlichen eines GitHub-Releases (Freigabemarke des Release-Zugs)
#   • montags, damit die Demo-Daten wieder bis heute reichen
#   • von Hand
on:
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# v3.4.0 (N1020) — Rechte je Job: Gebaut wird nur mit Leserechten (dort laufen
# PHP-Einrichtung und der Demo-Bau); schreiben darf allein der Job, der
# veröffentlicht, und der führt nur Actions von GitHub selbst aus.
permissions:
  contents: read

# Eine Veröffentlichung zur Zeit; eine neuere ersetzt eine wartende.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Demo bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Neuestes Release auschecken
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          fi
          git checkout --quiet "$TAG"
          echo "Demo aus $TAG"

      - name: PHP einrichten (8.4)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: mbstring, json
          coverage: none

      - name: Node.js einrichten (24)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Demo bauen
        run: node tools/build-demo.mjs --out dist/demo

      - name: Hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo

  deploy:
    name: Demo veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages einrichten
        uses: actions/configure-pages@v6

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
