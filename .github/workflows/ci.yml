name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Node-20-Deprecation der GitHub-Actions (u. a. actions/cache@v4) neutralisieren:
# Actions werden auf Node 24 gezwungen, bis native Node-24-Builds verfügbar sind.
# Analog zu docker-publish.yml (N1012). Workflow-weit für alle Jobs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# v3.4.0 (N1020) — ausdrücklich nur lesen. Die Voreinstellung des Repos ist
# schon `read`; so gilt es auch, falls sie sich einmal ändert. Kein Job hier
# braucht Schreibrechte (der Docker-Job baut nur lokal).
permissions:
  contents: read

jobs:
  test:
    name: Backend-Shape & Browser-Render Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: PHP einrichten (8.4)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: mbstring, json
          coverage: none

      - name: Node.js einrichten (20)
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: jsdom installieren
        run: npm install jsdom

      # v2.5.3 — ohne Server: Zahlen-Parser/Datumsformat (FE-02, FE-04) und die
      # Home-Assistant-Vorlage gegen beide Sprachfassungen der Anleitung.
      # v2.6.0 — Rückfragen bei der Erfassung (Sprung, Rückgang, gleicher Tag).
      # v2.11.0 — Router (veraltete Antworten, Zurück-Taste) und Kontraste (WCAG AA).
      # v2.15.0 — Chart-Schicht (Registry, Theme, Farben) und Monatsreihen (Teilmonate, Trends).
      # v3.2.0 — Nutzungsstufen (Navigation, CSS, Quelle der Stufe) und Schaubilder.
      # v3.4.0 (N1019) — jede Seite der Doku rendert sicher (Freigabeliste per PHP).
      # v3.4.0 (F1026) — Schaubilder: Energiefluss (Formel, Bilanz, Geometrie
      # R1–R5 × 7 Sprachen, Bedienung), Zeitstrahl, Geld und Wetter.
      # v3.4.0 (N1021) — ein Formularraster, [hidden], Darstellung mit Abzeichen.
      # v3.5.0 (F1027) — Tagesfilm: Viertelstundenmodell, Abspieler, Tastatur,
      # „Bewegung reduzieren“, „Tag“ nur mit Viertelstunden.
      - name: Frontend-Unit-Tests (Zahlenparser, HA-Vorlage, Plausibilität, Router, Kontraste, Charts, Doku, Schaubilder, Formulare)
        run: |
          node tests/format.test.mjs
          node tests/ha-snippet.test.mjs
          node tests/plausibility.test.mjs
          node tests/router.test.mjs
          node tests/contrast.test.mjs
          node tests/chart.test.mjs
          node tests/plural.test.mjs
          node tests/hardcoded-text.test.mjs
          node tests/outbox.test.mjs
          node tests/levels.test.mjs
          node tests/explainer.test.mjs
          node tests/day-film.test.mjs
          node tests/docs.test.mjs
          node tests/cache-names.test.mjs
          node tests/forms.test.mjs
          # v3.5.0 (N1022, N1023) — Einrichtung mit Sprache und Land, eine
          # Navigationsschwelle für CSS und Skript, Dialog zum Jahresbericht
          node tests/setup-wizard.test.mjs
          node tests/nav-threshold.test.mjs
          node tests/report-dialog.test.mjs
          # v3.6.0 — „Was ist neu“ und Hinweis auf neue Versionen
          node tests/release-notice.test.mjs
          # v3.5.0 (F1028) — Zuständig: Filter, „Ich bin …“, Chip, Dialog; Verlauf als CSV
          node tests/assignee.test.mjs
          # v3.6.0 (F1031) — Prognose-Werkstatt: Anfrage, Beispiele, Speichern, CSV, Stufen
          node tests/scenario.test.mjs

      - name: Demo-Daten vorbereiten
        run: cp -r demo-data /tmp/etdata

      - name: Migrations-Smoke (1.0.0 → aktuelles Schema)
        run: |
          # Separater Datensatz mit künstlich heruntergesetztem Schema,
          # damit der Migrationspfad weiterhin in der CI durchlaufen wird
          # (Demo-Daten selbst tragen seit v1.4.4 bereits 1.1.0).
          cp -r demo-data /tmp/etmigrate
          php -r '$f="/tmp/etmigrate/meta.json";
            $m=json_decode(file_get_contents($f),true);
            $m["schema_version"]="1.0.0"; unset($m["log"]);
            file_put_contents($f,json_encode($m));'
          rm -f /tmp/etmigrate/reminders.json
          # F1012: Bestandsdaten tragen den Skalar, keine Liste — genau der Pfad,
          # den ein Update von ≤ v2.4.2 nimmt.
          php -r '$f="/tmp/etmigrate/settings.json";
            $s=json_decode(file_get_contents($f),true);
            unset($s["gas_conversion_factors"]); $s["gas_conversion_factor"]=10.7;
            file_put_contents($f,json_encode($s));'
          php -r 'require "src/bootstrap.php";
            $s=new \Energietracker\Storage\JsonStore("/tmp/etmigrate");
            $mig=new \Energietracker\Storage\Migrator($s);
            if(!$mig->needsMigration()){fwrite(STDERR,"erwartete Migration nicht erkannt\n");exit(1);}
            $mig->migrate();
            $v=$s->read("meta.json",[])["schema_version"]??"?";
            $expected=\Energietracker\Storage\Migrator::SCHEMA_VERSION;
            if($v!==$expected){fwrite(STDERR,"Schema nach Migration: $v (erwartet $expected)\n");exit(1);}
            if(!$s->exists("reminders.json")){fwrite(STDERR,"reminders.json fehlt nach Migration\n");exit(1);}
            if(!$s->exists("strom/meter_groups.json")){fwrite(STDERR,"meter_groups.json fehlt nach Migration (F1006)\n");exit(1);}
            $mm=$s->read("strom/meters.json",[]); if($mm && !array_key_exists("external_id",$mm[0])){fwrite(STDERR,"external_id fehlt nach Migration (F1009)\n");exit(1);}
            if($mm && !array_key_exists("baseline_events",$mm[0])){fwrite(STDERR,"baseline_events fehlt nach Migration (F1011)\n");exit(1);}
            $st=$s->read("settings.json",[]);
            if(array_key_exists("gas_conversion_factor",$st)){fwrite(STDERR,"Skalar gas_conversion_factor nach Migration noch da (F1012)\n");exit(1);}
            $gf=$st["gas_conversion_factors"]??null;
            if(!is_array($gf)||!array_key_exists("from",$gf[0])||$gf[0]["from"]!==null||abs(($gf[0]["kwh_per_m3"]??0)-10.7)>1e-9){fwrite(STDERR,"gas_conversion_factors nach Migration falsch (F1012): ".json_encode($gf)."\n");exit(1);}
            echo "Migrations-Smoke OK: 1.0.0 -> $v\n";'

      - name: Tests (Server + Frontend-API-Shape + Browser-Render)
        run: |
          set -euo pipefail
          # router.php spiegelt das nginx-Routing (statische Assets +
          # /api → api.php). Ein eigener Server-Step würde nichts nützen:
          # GitHub Actions startet pro `run:` eine neue Shell, ein dort
          # gebackgroundeter Prozess überlebt den Step nicht. Daher
          # Start + Tests + Teardown in EINEM Step.
          php -S 127.0.0.1:8899 router.php >/tmp/server.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          # Readiness-Probe (max ~15 s)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8899/api/settings >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8899/api/settings >/dev/null
          # Statische Auslieferung muss funktionieren (Modulgraph-Crawl)
          curl -sf http://127.0.0.1:8899/public/js/app.js >/dev/null

          echo "── Frontend-API-Shape ──"
          node tests/frontend-api-shape.test.js

          echo "── Browser-Render ──"
          node \
            --import='data:text/javascript,import{register}from"node:module";import{pathToFileURL}from"node:url";register("./tests/esm-loader.mjs",pathToFileURL("./"));' \
            tests/browser-render.test.mjs

          echo "── Ausgelieferte Assets ──"
          # v2.2.0: Schriften und Chart.js liegen im Repo. Wären sie nicht
          # erreichbar, liefe die Anwendung ohne Diagramme und ohne Schrift —
          # ein Fehler, den die Render-Tests nicht sehen, weil JSDOM beides
          # nicht braucht.
          for asset in \
            /public/vendor/chart.umd.min.js \
            /public/vendor/fonts.css \
            /public/vendor/fonts/dm-sans.woff2 \
            /public/vendor/fonts/dm-mono-400.woff2 \
            /public/vendor/fonts/dm-mono-500.woff2
          do
            curl -sf "http://127.0.0.1:8899${asset}" > /dev/null \
              || { echo "FEHLT: ${asset}"; exit 1; }
          done
          echo "  alle Vendor-Assets ausgeliefert"
        env:
          ET_TEST_HOST: http://127.0.0.1:8899
          ET_DATA_DIR: /tmp/etdata

      # v3.0.0 — Öffentliche Demo: mit dem echten Server bauen (Demo-Daten bis
      # heute fortgeschrieben) und die echte App in JSDOM durch alle Seiten
      # klicken. Rot, wenn eine Seite eine Antwort braucht, die nicht
      # vorberechnet ist. Startet eigene Server (8895 PHP, 8894 statisch).
      - name: Öffentliche Demo (bauen und durchklicken)
        run: node tests/demo.test.mjs

      # v3.4.0 (N1020) — dieselbe App mit präparierten Daten (HTML und
      # Anführungszeichen in Namen, Notizen, Anbietern …) durch alle Seiten:
      # Kein Wert darf als HTML in der Seite landen. Startet einen eigenen
      # Server auf einem freien Port.
      - name: Ansichten mit präparierten Daten (kein HTML aus den Daten)
        run: node tests/poisoned-render.test.mjs

      # v3.4.0 (N1021) — Vertragsreihenfolge, Blättern und Rechnung prüfen mit
      # dem Beispielhaushalt „eigenheim-modern“ und 400 Tageswerten. Startet
      # einen eigenen Server auf einem freien Port (ET_LISTS_PORT).
      - name: Listen, Verträge, Rechnung prüfen (Beispielhaushalt)
        run: node tests/lists.test.mjs

  lint-php:
    name: PHP Syntax-Check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # v3.1.0 (API-39) — Mindestversion PHP 8.2 (Debian 12), 8.3 (Ubuntu 24.04); v3.4.0 — 8.4 und 8.5 (Docker)
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v7

      - name: PHP einrichten (${{ matrix.php }})
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Syntax aller PHP-Dateien prüfen
        run: find . -name "*.php" -not -path "./.git/*" -not -path "./vendor/*" | xargs -P4 -I{} php -l {}

  phpunit:
    name: PHPUnit-Suite (Service-Schicht) (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # v3.1.0 (API-39) — Mindestversion PHP 8.2 (Debian 12), 8.3 (Ubuntu 24.04); v3.4.0 — 8.4 und 8.5 (Docker)
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    needs: lint-php

    steps:
      - uses: actions/checkout@v7

      - name: PHP einrichten (${{ matrix.php }})
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Composer-Cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Composer-Dependencies installieren
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: PHPUnit ausführen
        run: vendor/bin/phpunit --no-coverage

  docker:
    name: Docker-Image bauen & smoke-testen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Image bauen
        run: docker build -t energietracker:ci .

      - name: Container starten
        run: |
          docker run -d --name et -p 8080:80 energietracker:ci
          # Readiness-Probe gegen den N1003-Health-Endpoint (max ~30 s)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: End-to-End-Smoke (Routing + statische Assets)
        run: |
          set -euo pipefail
          # Health-Endpoint liefert JSON mit success:true
          # Antworten erst in eine Datei, dann greppen: `grep -q` schließt die
          # Pipe beim ersten Treffer, curl bekommt SIGPIPE (Exit 23) und
          # pipefail macht den Step rot — je nach Antwortgröße mal ja, mal nein.
          curl -sf http://127.0.0.1:8080/api/health -o /tmp/health.json
          grep -q '"success":true' /tmp/health.json
          # /api/… und /api.php/api/… müssen beide auf dieselbe Route zeigen
          curl -sf http://127.0.0.1:8080/api/settings          >/dev/null
          curl -sf http://127.0.0.1:8080/api.php/api/settings  >/dev/null
          # Statische Auslieferung (Modulgraph)
          curl -sf http://127.0.0.1:8080/public/js/app.js >/dev/null
          # v2.2.0 — Schriften und Chart.js liegen im Image. `vendor` steht in
          # .gitignore und .dockerignore; ohne Pfad-Anker hätten die Muster auch
          # public/vendor/ verschluckt und die Anwendung liefe ohne Diagramme
          # und ohne Schrift. Das fällt sonst erst beim Nutzer auf.
          curl -sf http://127.0.0.1:8080/public/vendor/chart.umd.min.js       >/dev/null
          curl -sf http://127.0.0.1:8080/public/vendor/fonts.css              >/dev/null
          curl -sf http://127.0.0.1:8080/public/vendor/fonts/dm-sans.woff2    >/dev/null
          curl -sf http://127.0.0.1:8080/public/vendor/fonts/dm-mono-400.woff2 >/dev/null
          # Und nichts darf zur Laufzeit an einen fremden Server gehen.
          curl -s http://127.0.0.1:8080/ -o /tmp/shell.html
          ! grep -qE 'src="https?://|href="https?://fonts' /tmp/shell.html
          # SPA-Shell-Fallback
          grep -qi 'energietracker' /tmp/shell.html
          # /data darf NICHT ausgeliefert werden
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/data/meta.json)" = "404"
          # v2.6.0 — auch sonst nur Auslieferungsgut, und die Shell trägt eine CSP
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.htaccess)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/README.md)" = "404"
          # v3.4.0 (N1019) — die Doku reist im Image mit und ist nur über die API
          # lesbar (Freigabeliste); direkt bleiben docs/ und CHANGELOG.md gesperrt
          test "$(curl -s -o /tmp/docs.json -w '%{http_code}' 'http://127.0.0.1:8080/api/docs?path=README.md')" = "200"
          grep -q '"markdown":"# ' /tmp/docs.json
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/api/docs?path=root/CHANGELOG.md')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/api/docs/asset?path=ui/screenshots/dashboard.png')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/api/docs?path=../VERSION')" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs/README.md)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/CHANGELOG.md)" = "404"
          curl -sI http://127.0.0.1:8080/ -o /tmp/shell.headers
          grep -qi "content-security-policy: default-src 'self'" /tmp/shell.headers
          grep -q '"status":"ok"' /tmp/health.json

      # v3.4.0 (N1020) — php-fpm nur im Container: auf 127.0.0.1:9000 erreichbar
      # (sonst wäre die Prüfung danach wertlos), über die Adresse des Containers
      # nicht — also auch nicht für andere Container im selben Netz.
      - name: php-fpm nur intern (Port 9000 von außen zu)
        run: |
          set -euo pipefail
          docker exec et php -r 'exit(@fsockopen("127.0.0.1", 9000, $e, $m, 3) ? 0 : 1);'
          docker exec et php -r '$ip = gethostbyname(gethostname()); exit(@fsockopen($ip, 9000, $e, $m, 3) ? 1 : 0);'
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' et)
          echo "Container-Adresse: $IP"
          if timeout 5 bash -c "echo > /dev/tcp/$IP/9000" 2>/dev/null; then
            echo "Port 9000 ist von außen erreichbar"; exit 1
          fi
          # Gegenprobe: dieselbe Methode erreicht nginx auf Port 80
          timeout 5 bash -c "echo > /dev/tcp/$IP/80"
          echo "Port 9000 nur intern"

      # v3.4.0 (N1020) — das gehärtete Compose-Beispiel aus docs/betrieb/docker.md
      # (no-new-privileges, Capabilities, nur lesbares Dateisystem, Port nur
      # auf 127.0.0.1) startet, antwortet und kann schreiben.
      - name: Gehärteter Betrieb (Beispiel aus der Doku)
        run: |
          set -euo pipefail
          docker volume create etdata-hardened
          docker run -d --name et-hardened \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --cap-add DAC_OVERRIDE --cap-add NET_BIND_SERVICE --cap-add KILL \
            --read-only --tmpfs /run --tmpfs /tmp --tmpfs /var/lib/nginx/tmp \
            -v etdata-hardened:/data -p 127.0.0.1:8081:80 energietracker:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/api/health -o /tmp/health-hardened.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health-hardened.json
          curl -sf -X PATCH -H 'Content-Type: application/json' -d '{"wohnflaeche_m2": 91}' \
            http://127.0.0.1:8081/api/settings -o /tmp/settings-hardened.json
          grep -q '"wohnflaeche_m2":91' /tmp/settings-hardened.json
          curl -sf http://127.0.0.1:8081/public/js/app.js >/dev/null
          echo "gehärteter Betrieb ok"

      # v3.5.0 (N1025) — wie als Home-Assistant-App: die Umgebung aus der
      # config.yaml der App, /data als Volume, und vor dem zweiten Start legt
      # root (wie der Supervisor vor jedem Start) eine options.json mit Rechten
      # 0600 hinein. Der HEALTHCHECK des Images ist für Home Assistant die
      # Überwachung der App; er muss danach weiter „healthy" melden. Ohne den
      # Supervisor kennt die App keine Person: Daten zu, Push nur mit Token.
      - name: Wie als Home-Assistant-App (options.json, HEALTHCHECK)
        run: |
          set -euo pipefail
          cleanup() {
            docker logs et-ha || true
            docker rm -f et-ha >/dev/null 2>&1 || true
            docker volume rm etdata-ha >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create etdata-ha
          docker run -d --name et-ha -e ET_DATA_DIR=/data -e ET_AUTH=proxy \
            -e ET_TRUSTED_PROXIES=172.30.32.2 -e TZ=Europe/Berlin \
            -v etdata-ha:/data -p 127.0.0.1:8082:80 energietracker:ci
          wait_healthy() {
            s=none
            for i in $(seq 1 75); do
              s=$(docker inspect -f '{{.State.Health.Status}}' et-ha)
              if [ "$s" = "healthy" ]; then return 0; fi
              if [ "$s" = "unhealthy" ]; then break; fi
              sleep 2
            done
            echo "HEALTHCHECK: $s"
            curl -s http://127.0.0.1:8082/api/health || true
            return 1
          }
          wait_healthy
          docker stop et-ha
          docker run --rm --user root --entrypoint sh -v etdata-ha:/data energietracker:ci -c \
            'printf "{}" > /data/options.json.new && chmod 600 /data/options.json.new && mv /data/options.json.new /data/options.json && ls -ln /data/options.json'
          docker start et-ha
          wait_healthy
          curl -sf http://127.0.0.1:8082/api/health -o /tmp/health-ha.json
          grep -q '"status":"ok"' /tmp/health-ha.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Ingress-Path: /api/hassio_ingress/x' \
            -H 'X-Remote-User-Id: ha-1' http://127.0.0.1:8082/api/utilities)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"utility":"strom","meter":"x","value":1}' http://127.0.0.1:8082/api/ingest)" = "401"
          echo "wie als Home-Assistant-App ok"

      # v3.5.0 (N1024) — dieselbe Dockerfile, Ziel `rootless` (Stufe `base` aus
      # dem Cache des Standard-Baus).
      - name: Image ohne root bauen
        run: docker build --target rootless -t energietracker:ci-rootless .

      # Das Beispiel aus docs/betrieb/docker.md („Ohne root“): keine
      # Capabilities, nur lesbares Dateisystem, Named Volume. Prüft Health,
      # Schreiben ins Volume, einen Körper über dem Puffer von nginx
      # (Zwischenspeicher unter /tmp) und dass kein Prozess als root läuft.
      - name: Ohne root (Beispiel aus der Doku)
        run: |
          set -euo pipefail
          docker volume create etdata-rootless
          docker run -d --name et-rootless \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --read-only --tmpfs /tmp \
            -v etdata-rootless:/data -p 127.0.0.1:8082:8080 energietracker:ci-rootless
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8082/api/health -o /tmp/health-rootless.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health-rootless.json
          grep -q '"data_dir_writable":true' /tmp/health-rootless.json
          curl -sf -X PATCH -H 'Content-Type: application/json' -d '{"wohnflaeche_m2": 92}' \
            http://127.0.0.1:8082/api/settings -o /tmp/settings-rootless.json
          grep -q '"wohnflaeche_m2":92' /tmp/settings-rootless.json
          docker exec et-rootless test -s /data/settings.json
          curl -sf http://127.0.0.1:8082/public/js/app.js >/dev/null
          # 64 KB Körper: nginx puffert ihn in einer Datei (client_body_temp_path)
          printf '{"location_name":"%s"}' "$(head -c 65536 /dev/zero | tr '\0' x)" > /tmp/big.json
          curl -s -X PATCH -H 'Content-Type: application/json' --data-binary @/tmp/big.json \
            http://127.0.0.1:8082/api/settings -o /tmp/big-answer.json
          grep -q '"success"' /tmp/big-answer.json
          # wirklich nicht root: die UID des Images, und kein Prozess mit UID 0
          test "$(docker exec et-rootless id -u)" = "10001"
          docker exec et-rootless sh -c 'for f in /proc/[0-9]*/status; do grep "^Uid:" "$f" 2>/dev/null; done' > /tmp/uids.txt || true
          cat /tmp/uids.txt
          test -s /tmp/uids.txt
          # erst in eine Datei: `grep -q` am Ende einer Pipe beendet awk vorzeitig,
          # und mit pipefail wäre die Bedingung dann still falsch (Lektion 30)
          awk '{print $2; print $3}' /tmp/uids.txt > /tmp/uid-list.txt
          if grep -qx 0 /tmp/uid-list.txt; then echo "Prozess als root"; exit 1; fi
          echo "ohne root ok"

      # Ein Datenordner, der einer anderen UID gehört (hier dem Runner): klare
      # Meldung im Log und in /api/health statt 500. Gegenproben aus der Doku:
      # derselbe Ordner mit `--user <Besitzer>` läuft, und eine beliebige UID
      # mit Gruppe 0 schreibt in ein frisches Named Volume (g=u).
      - name: Ohne root, Datenordner einer anderen UID
        run: |
          set -euo pipefail
          mkdir -p /tmp/etdata-foreign
          chmod 755 /tmp/etdata-foreign
          docker run -d --name et-rootless-foreign \
            -v /tmp/etdata-foreign:/data -p 127.0.0.1:8083:8080 energietracker:ci-rootless
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health-foreign.json -w '%{http_code}' http://127.0.0.1:8083/api/health || true)
            if [ "$code" = "503" ]; then break; fi
            sleep 1
          done
          test "$code" = "503"
          grep -q '"data_dir_writable":false' /tmp/health-foreign.json
          test "$(curl -s -o /tmp/settings-foreign.json -w '%{http_code}' http://127.0.0.1:8083/api/settings)" = "503"
          grep -q '"code":"errors.storage.notWritable"' /tmp/settings-foreign.json
          docker logs et-rootless-foreign > /tmp/rootless-foreign.log 2>&1
          grep -q 'Datenverzeichnis nicht beschreibbar' /tmp/rootless-foreign.log
          docker rm -f et-rootless-foreign
          docker run -d --name et-rootless-foreign --user "$(id -u):$(id -g)" \
            -v /tmp/etdata-foreign:/data -p 127.0.0.1:8083:8080 energietracker:ci-rootless
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8083/api/health -o /tmp/health-foreign.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health-foreign.json
          test -s /tmp/etdata-foreign/meta.json
          docker volume create etdata-gid0
          docker run -d --name et-rootless-gid0 --user 12345:0 \
            -v etdata-gid0:/data -p 127.0.0.1:8084:8080 energietracker:ci-rootless
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8084/api/health -o /tmp/health-gid0.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/health-gid0.json
          curl -sf -X PATCH -H 'Content-Type: application/json' -d '{"wohnflaeche_m2": 93}' \
            http://127.0.0.1:8084/api/settings -o /tmp/settings-gid0.json
          grep -q '"wohnflaeche_m2":93' /tmp/settings-gid0.json
          echo "Meldung, eigene UID und Gruppe 0 ok"

      - name: Container-Logs (Diagnose)
        if: always()
        run: |
          docker logs et || true
          docker logs et-hardened || true
          docker logs et-rootless || true
          docker logs et-rootless-foreign || true
          docker logs et-rootless-gid0 || true

      - name: Aufräumen
        if: always()
        run: |
          docker rm -f et et-hardened et-rootless et-rootless-foreign et-rootless-gid0 || true
          docker volume rm etdata-hardened etdata-rootless etdata-gid0 || true
