name: Docker Publish

# Baut das Image bei jedem Versions-Tag (v*) und veröffentlicht es auf GHCR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Image bauen & nach GHCR pushen
    runs-on: ubuntu-latest

    # N1012: GitHub erzwingt Node 24 für JS-Actions ab 2026-06-16. Wir opten
    # bereits jetzt darauf ein, damit die docker/*-Actions Node-24-erprobt sind
    # und keine Deprecation-Warnung mehr ausgeben.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v7

      - name: QEMU einrichten (für arm64-Emulation beim Multi-Arch-Build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: An GHCR anmelden
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & Labels ableiten
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bingerminger/energietracker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Bauen & pushen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # v2.6.0 — Herkunftsnachweis und Stückliste (SBOM) am Image
          provenance: true
          sbom: true
