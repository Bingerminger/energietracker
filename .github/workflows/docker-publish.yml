name: Docker Publish

# Baut das Image bei jedem Versions-Tag (v*) und veröffentlicht es auf GHCR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Image bauen & nach GHCR pushen
    runs-on: ubuntu-latest

    # N1012: GitHub erzwingt Node 24 für JS-Actions ab 2026-06-16. Wir opten
    # bereits jetzt darauf ein, damit die docker/*-Actions Node-24-erprobt sind
    # und keine Deprecation-Warnung mehr ausgeben.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5

      - name: QEMU einrichten (für arm64-Emulation beim Multi-Arch-Build)
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bingerminger/energietracker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Bauen & pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
