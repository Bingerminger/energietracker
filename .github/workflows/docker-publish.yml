name: Docker Publish

# Baut das Image bei jedem Versions-Tag (v*) und veröffentlicht es auf GHCR.
# v3.5.0 (N1024) — dazu die Variante ohne root aus derselben Dockerfile
# (Ziel `rootless`): Tags mit der Endung `-rootless`, gleiche Plattformen.
# v3.10.0 — jedes veröffentlichte Image wird per Digest signiert (cosign
# keyless: Zertifikat über das OIDC-Token dieses Laufs, Eintrag im
# öffentlichen Transparenzlog Rekor, kein Schlüssel im Repo). Danach ein
# Grype-Scan beider Varianten, nur Befunde mit verfügbarem Fix, nicht
# blockierend → Security → Code scanning. Herkunftsnachweis und SBOM hängen
# weiter als BuildKit-Attestierungen am Image (seit v2.6.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Image bauen & nach GHCR pushen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign keyless: OIDC-Token des Laufs für das Signaturzertifikat
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      digest-rootless: ${{ steps.build-rootless.outputs.digest }}

    # N1012: GitHub erzwingt Node 24 für JS-Actions ab 2026-06-16. Wir opten
    # bereits jetzt darauf ein, damit die docker/*-Actions Node-24-erprobt sind
    # und keine Deprecation-Warnung mehr ausgeben. (Seit v3.5.0 laufen alle
    # hier genutzten Actions selbst auf Node 24; der Schalter schadet nicht.)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v7

      - name: QEMU einrichten (für arm64-Emulation beim Multi-Arch-Build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: An GHCR anmelden
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & Labels ableiten
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bingerminger/energietracker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Bauen & pushen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # v2.6.0 — Herkunftsnachweis und Stückliste (SBOM) am Image
          provenance: true
          sbom: true

      # v3.5.0 (N1024) — `latest` bleibt dem Standard-Image: kein automatisches
      # latest (flavor latest=false), die Endung steht an jedem Tag selbst.
      - name: Tags & Labels ableiten (ohne root)
        id: meta-rootless
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bingerminger/energietracker
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-rootless
            type=semver,pattern={{major}}.{{minor}},suffix=-rootless
            type=semver,pattern={{major}},suffix=-rootless
            type=raw,value=latest-rootless

      # Die Stufe `base` kommt aus dem Builder-Cache des Schritts davor.
      - name: Bauen & pushen (ohne root)
        id: build-rootless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: rootless
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-rootless.outputs.tags }}
          labels: ${{ steps.meta-rootless.outputs.labels }}
          cache-from: type=gha,scope=rootless
          cache-to: type=gha,mode=max,scope=rootless
          provenance: true
          sbom: true

      # v3.10.0 — Signatur je Variante, per Digest (alle Tags einer Variante
      # zeigen auf denselben Index; Tags können wandern, der Digest nicht).
      # Prüfen: docs/betrieb/docker.md → „Signatur und Stückliste prüfen“.
      - name: cosign einrichten
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Signieren (cosign keyless, beide Varianten)
        env:
          IMAGE: ghcr.io/bingerminger/energietracker
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_ROOTLESS: ${{ steps.build-rootless.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST" && test -n "$DIGEST_ROOTLESS"
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST_ROOTLESS"

  # v3.10.0 — Scan direkt nach dem Release (bisher erst beim Wochen-Neubau).
  # Nur Befunde mit verfügbarem Fix: Was niemand beheben kann, verdeckt sonst,
  # was ein Neubau beheben würde. Gleiche Kategorien wie im Wochen-Neubau —
  # der jüngste Lauf ersetzt die Treffer des vorigen.
  scan:
    name: Image auf bekannte Lücken prüfen (${{ matrix.variant }}, nicht blockierend)
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            category: container-image
          - variant: rootless
            category: container-image-rootless
    steps:
      - name: Scan (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/bingerminger/energietracker@${{ matrix.variant == 'standard' && needs.publish.outputs.digest || needs.publish.outputs.digest-rootless }}
          only-fixed: true
          fail-build: false
          output-format: sarif

      - name: Ergebnis hochladen (Security → Code scanning)
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ matrix.category }}
          # v3.10.1 — unter main melden (der Tag liegt auf main): Security zeigt sonst bis zum nächsten
          # Wochen-Neubau die Befunde des alten Image, obwohl das neue Release sie behoben hat
          ref: refs/heads/main
          sha: ${{ github.sha }}
