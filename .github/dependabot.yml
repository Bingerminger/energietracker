# v2.6.0 — Basis-Image und Actions aktuell halten (Review 2026-09-24).
# Dependabot schlägt Updates als Pull-Request vor; nichts wird automatisch
# übernommen.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  # v3.4.0 (N1020) — Actions sind per Commit-SHA gepinnt (Kommentar = Version);
  # Dependabot hebt SHA und Kommentar gemeinsam. Dazu PHPUnit (composer, nur
  # für die Tests — die Laufzeit hat keine Abhängigkeiten).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    # v3.10.0 — PHPUnit bleibt bei 11: Die Mindestversion des Energietrackers
    # ist PHP 8.2, und die CI prüft 8.2 bis 8.5. PHPUnit 12 verlangt PHP 8.3,
    # 13 verlangt 8.4. Updates innerhalb von 11 kommen weiter.
    ignore:
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
